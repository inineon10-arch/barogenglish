<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BAROG · 학습 자료실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+KR:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f5f1ea; --bg-alt:#ebe5d9;
    --ink:#1f2a30; --ink-soft:#4a5560; --ink-mute:#7a8590;
    --accent:#6b4423; --accent-soft:#a07855;
    --line:#d6cfc0; --card:#fbf8f2;
    --shadow:0 1px 2px rgba(31,42,48,.04),0 8px 24px rgba(31,42,48,.06);
    --shadow-hover:0 2px 4px rgba(31,42,48,.06),0 16px 40px rgba(31,42,48,.10);
    --purple:#7036e3;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Noto Serif KR','Cormorant Garamond',Georgia,serif;
    background:var(--bg);color:var(--ink);line-height:1.7;min-height:100vh;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(ellipse at top left,rgba(160,120,85,.06),transparent 50%),
      radial-gradient(ellipse at bottom right,rgba(107,68,35,.04),transparent 50%);
  }

  /* HEADER */
  .site-header{border-bottom:1px solid var(--line);background:rgba(245,241,234,.85);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;}
  .header-inner{max-width:1180px;margin:0 auto;padding:1.25rem 2rem;display:flex;justify-content:space-between;align-items:center;}
  .logo{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:600;letter-spacing:.02em;color:var(--ink);text-decoration:none;}
  .nav{display:flex;gap:2rem;font-family:'Inter',sans-serif;font-size:.9rem;}
  .nav a{color:var(--ink-soft);text-decoration:none;cursor:pointer;padding-bottom:2px;border-bottom:1px solid transparent;transition:color .2s,border-color .2s;}
  .nav a:hover{color:var(--accent);}
  .nav a.active{color:var(--accent);border-bottom-color:var(--accent);}
  .nav a.vocab-nav.active{color:var(--purple);border-bottom-color:var(--purple);}

  /* HERO */
  .hero{max-width:1180px;margin:0 auto;padding:6rem 2rem 5rem;display:grid;grid-template-columns:1fr auto;gap:3rem;align-items:end;border-bottom:1px solid var(--line);}
  .hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.8rem,6vw,4.5rem);font-weight:500;line-height:1.05;letter-spacing:-.01em;margin-bottom:1.5rem;}
  .hero h1 em{font-style:italic;color:var(--accent);font-weight:400;}
  .hero-subtitle{font-size:1.05rem;color:var(--ink-soft);max-width:540px;line-height:1.8;}

  /* TAB BAR */
  .tab-bar{max-width:1180px;margin:0 auto;padding:2.5rem 2rem 0;display:flex;border-bottom:1px solid var(--line);}
  .tab-btn{font-family:'Noto Serif KR',serif;font-size:1rem;font-weight:500;color:var(--ink-mute);background:none;border:none;border-bottom:2px solid transparent;padding:.75rem 1.75rem;margin-bottom:-1px;cursor:pointer;letter-spacing:.02em;transition:color .2s,border-color .2s;}
  .tab-btn:hover{color:var(--ink-soft);}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab-btn.vocab-tab.active{color:var(--purple);border-bottom-color:var(--purple);}

  /* SECTIONS */
  .materials-section{max-width:1180px;margin:0 auto;padding:4rem 2rem 6rem;display:none;}
  .materials-section.visible{display:block;}
  .section-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3rem;padding-bottom:1.5rem;border-bottom:1px solid var(--line);}
  .section-title{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:500;letter-spacing:-.005em;}
  .section-title em{font-style:italic;color:var(--accent);}
  .section-title.vocab-title em{color:var(--purple);}
  .section-count{font-family:'Inter',sans-serif;font-size:.85rem;color:var(--ink-mute);letter-spacing:.05em;}

  /* SEARCH */
  .search-wrap{margin-bottom:2.5rem;position:relative;max-width:480px;}
  .search-input{width:100%;padding:.9rem 1.1rem .9rem 2.8rem;font-family:'Noto Serif KR',serif;font-size:.95rem;background:var(--card);border:1px solid var(--line);border-radius:2px;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s;}
  .search-input:focus{border-color:var(--accent-soft);box-shadow:0 0 0 3px rgba(160,120,85,.1);}
  .search-input::placeholder{color:var(--ink-mute);font-style:italic;}
  .search-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--ink-mute);pointer-events:none;}

  /* ── 오답단어 카드 그리드 ── */
  .materials-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;}
  .material-card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:1.1rem 1rem;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:.5rem;transition:transform .3s,box-shadow .3s,border-color .3s;position:relative;overflow:hidden;box-shadow:var(--shadow);animation:fadeUp .5s ease both;}
  .material-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .4s;}
  .material-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--accent-soft);}
  .material-card:hover::before{transform:scaleX(1);}
  .card-number{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.75rem;color:var(--accent);letter-spacing:.05em;}
  .card-title{font-family:'Noto Serif KR',serif;font-size:.95rem;font-weight:600;line-height:1.4;color:var(--ink);}
  .card-description{font-size:.78rem;color:var(--ink-soft);line-height:1.6;flex-grow:1;}
  .card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:.25rem;padding-top:.6rem;border-top:1px dashed var(--line);}
  .card-tag{font-family:'Inter',sans-serif;font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-mute);}
  .card-arrow{font-family:'Cormorant Garamond',serif;font-size:1rem;color:var(--accent);transition:transform .3s;}
  .material-card:hover .card-arrow{transform:translateX(4px);}

  /* ── 진도단어 플래시카드 ── */
  .vocab-meta-bar{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:2rem;}
  .vocab-stat{font-family:'Inter',sans-serif;font-size:.75rem;color:var(--ink-mute);}
  .vocab-stat strong{color:var(--purple);font-weight:600;}
  .vocab-flip-btn{font-family:'Inter',sans-serif;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:.5rem 1.1rem;border-radius:20px;border:1.5px solid rgba(112,54,227,.35);background:rgba(112,54,227,.04);color:var(--purple);cursor:pointer;transition:all .2s;margin-left:auto;}
  .vocab-flip-btn:hover{background:rgba(112,54,227,.12);border-color:var(--purple);}

  .vocab-grid{display:flex;flex-direction:column;gap:2.5rem;}
  .vocab-day-group{}
  .day-label{font-family:'Inter',sans-serif;font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.6rem;}
  .day-badge{background:rgba(112,54,227,.1);color:var(--purple);border-radius:20px;padding:2px 10px;font-size:.65rem;font-weight:600;}

  .vocab-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.65rem;}

  .vcard{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.85rem .8rem;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(31,42,48,.04);user-select:none;-webkit-user-select:none;}
  .vcard::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--purple);transform:scaleY(0);transform-origin:top;transition:transform .3s;}
  .vcard:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(112,54,227,.12);border-color:rgba(112,54,227,.3);}
  .vcard:hover::before{transform:scaleY(1);}
  .vcard.open{background:rgba(112,54,227,.03);border-color:rgba(112,54,227,.22);}
  .vcard.open::before{transform:scaleY(1);}

  .vcard-pos{display:inline-block;font-family:'Inter',sans-serif;font-size:.56rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:rgba(112,54,227,.08);color:var(--purple);border-radius:10px;padding:1px 7px;margin-bottom:.3rem;}
  .vcard-en{font-family:'Inter',sans-serif;font-size:.88rem;font-weight:600;color:var(--ink);letter-spacing:-.01em;}
  .vcard-ko{font-size:.76rem;color:var(--ink-soft);line-height:1.5;margin-top:.3rem;display:none;}
  .vcard-hint{font-size:.6rem;color:var(--ink-mute);margin-top:.25rem;}
  .vcard.open .vcard-ko{display:block;}
  .vcard.open .vcard-hint{display:none;}

  /* 로딩 */
  .loading-box{display:flex;flex-direction:column;align-items:center;gap:1rem;padding:4rem 2rem;color:var(--ink-mute);font-family:'Inter',sans-serif;font-size:.85rem;}
  .spinner{width:30px;height:30px;border:2.5px solid var(--line);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

  .no-results{grid-column:1/-1;text-align:center;padding:4rem 2rem;color:var(--ink-mute);font-style:italic;}

  /* FOOTER */
  .site-footer{border-top:1px solid var(--line);background:var(--bg-alt);padding:3rem 2rem;margin-top:4rem;}
  .footer-inner{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1.5rem;}
  .footer-text{font-family:'Inter',sans-serif;font-size:.85rem;color:var(--ink-mute);}
  .footer-text em{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--accent);}

  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .hero > *,.section-header,.search-wrap{animation:fadeUp .8s ease both;}
  .material-card{animation:fadeUp .5s ease both;}

  @media(max-width:768px){
    .header-inner{padding:1rem 1.25rem;} .nav{gap:1.25rem;font-size:.85rem;}
    .hero{grid-template-columns:1fr;padding:4rem 1.25rem 3rem;gap:2rem;}
    .tab-bar{padding:1.5rem 1.25rem 0;} .materials-section{padding:3rem 1.25rem 4rem;}
    .section-header{flex-direction:column;align-items:flex-start;gap:.5rem;}
    .materials-grid{grid-template-columns:repeat(2,1fr);gap:.75rem;}
    .material-card{padding:1rem .875rem;}
    .vocab-cards{grid-template-columns:repeat(2,1fr);}
    .footer-inner{flex-direction:column;text-align:center;}
  }
  @media(max-width:420px){
    .materials-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="#" class="logo">BAROG English</a>
    <nav class="nav">
      <a onclick="switchTab('wrong')" id="nav-wrong" class="active">오답단어</a>
      <a onclick="switchTab('vocab')" id="nav-vocab" class="vocab-nav">진도단어</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div>
    <h1>Practice<br><em>makes</em> Perfect</h1>
    <p class="hero-subtitle">오늘의 오답은 내일의 실력이 됩니다.</p>
  </div>
</section>

<div class="tab-bar">
  <button class="tab-btn active"   id="tab-wrong" onclick="switchTab('wrong')">오답단어</button>
  <button class="tab-btn vocab-tab" id="tab-vocab" onclick="switchTab('vocab')">진도단어</button>
</div>

<!-- ★ 오답단어 — 수동 파일 링크 (플래시카드) -->
<main class="materials-section visible" id="section-wrong">
  <div class="section-header">
    <h2 class="section-title">오답단어 <em></em></h2>
    <div class="section-count" id="count-wrong">전체 자료</div>
  </div>
  <div class="search-wrap">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" class="search-input" id="search-wrong" placeholder="날짜로 검색하세요." aria-label="오답단어 검색">
  </div>
  <div class="materials-grid" id="grid-wrong"></div>
</main>

<!-- ★ 진도단어 — 구글 시트 자동 로딩 플래시카드 -->
<main class="materials-section" id="section-vocab">
  <div class="section-header">
    <h2 class="section-title vocab-title">진도단어 <em></em></h2>
    <div class="section-count" id="count-vocab">불러오는 중...</div>
  </div>
  <div class="search-wrap">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" class="search-input" id="search-vocab" placeholder="단어나 뜻으로 검색하세요.">
  </div>
  <div class="vocab-meta-bar" id="vocab-meta" style="display:none">
    <span class="vocab-stat">단어 <strong id="vocab-total">0</strong>개</span>
    <span class="vocab-stat">· Day <strong id="vocab-days">0</strong>개</span>
    <button class="vocab-flip-btn" onclick="flipAll()">전체 뒤집기</button>
  </div>
  <div id="vocab-content">
    <div class="loading-box"><div class="spinner"></div><span>단어 불러오는 중...</span></div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-text">Barog English · <em>Crafted with care for our students</em></div>
  </div>
</footer>

<script>
/* ============================================================
   ★ 오답단어 목록 — 새 시험 후 여기에 한 줄씩 추가
   ============================================================ */
const wrongMaterials = [
  { filename:"lesson-04.html", title:"5월 15일", description:"금요일", tag:"." },
  { filename:"lesson-03.html", title:"5월 13일", description:"수요일", tag:"." },
  { filename:"lesson-02.html", title:"5월 10일", description:"일요일", tag:"." },
  { filename:"lesson-01.html", title:"5월 6일",  description:"수요일", tag:"." },
];

/* ============================================================
   ★ 진도단어 구글 시트 — 웹에 게시 CSV URL
   ============================================================ */
const VOCAB_CSV = https://docs.google.com/spreadsheets/d/e/2PACX-1vSwVyD25PYnOiPEOZhMGy2ZQpt8jQmG6DYM7mXB_2FaR2hCPDTk8kmqAUT4xiUSO-fHhT56N4symdII/pub?gid=2131879579&single=true&output=csv';

/* ============================================================
   탭 전환
   ============================================================ */
function switchTab(t) {
  ['wrong','vocab'].forEach(id => {
    document.getElementById('section-'+id).classList.toggle('visible', id===t);
    document.getElementById('tab-'+id).classList.toggle('active', id===t);
    const n = document.getElementById('nav-'+id);
    if(n) n.classList.toggle('active', id===t);
  });
  if(t==='vocab' && !vocabLoaded) loadVocab();
}

/* ============================================================
   오답단어 렌더
   ============================================================ */
function pad(n){ return String(n).padStart(2,'0'); }

function renderWrong(list) {
  const grid = document.getElementById('grid-wrong');
  const cnt  = document.getElementById('count-wrong');
  grid.innerHTML = '';
  if(!list.length){ grid.innerHTML='<div class="no-results">자료가 없습니다.</div>'; cnt.textContent='자료 없음'; return; }
  cnt.textContent = `전체 ${list.length}개 자료`;
  list.forEach((item,i) => {
    const a = document.createElement('a');
    a.className = 'material-card';
    a.href = `materials/${item.filename}`;
    a.style.animationDelay = `${0.04*i}s`;
    a.innerHTML = `
      <div class="card-number">No. ${pad(i+1)}</div>
      <div class="card-title">${esc(item.title)}</div>
      <div class="card-description">${esc(item.description)}</div>
      <div class="card-footer"><span class="card-tag">${esc(item.tag)}</span><span class="card-arrow">→</span></div>`;
    grid.appendChild(a);
  });
}
document.getElementById('search-wrong').addEventListener('input', e => {
  const k = e.target.value.trim().toLowerCase();
  renderWrong(k ? wrongMaterials.filter(m => m.title.toLowerCase().includes(k)||m.description.toLowerCase().includes(k)) : wrongMaterials);
});
renderWrong(wrongMaterials);

/* ============================================================
   진도단어 — CSV 로딩
   ============================================================ */
let vocabLoaded = false;
let allWords = [];
let allOpen  = false;

function csvSplit(line) {
  const r=[]; let cur='', q=false;
  for(const c of line){ if(c==='"'){q=!q;}else if(c===','&&!q){r.push(cur);cur='';}else{cur+=c;} }
  r.push(cur); return r;
}

async function loadVocab() {
  vocabLoaded = true;
  try {
    const res = await fetch(VOCAB_CSV);
    if(!res.ok) throw new Error('시트를 불러올 수 없습니다 ('+res.status+')');
    const text = await res.text();
    const lines = text.trim().split('\n').map(l=>l.replace(/\r$/,''));

    /* ── 헤더 감지: 첫 줄에 '단어'가 있으면 헤더형, 없으면 데이터형 ── */
    const firstCols = csvSplit(lines[0]);
    const hasHeader = firstCols.some(c=>/^단어$/i.test(c.trim()));

    if(hasHeader) {
      /* 형식 A: 헤더행 있음 — 단어, 뜻, 품사, 출처날짜 */
      const heads = firstCols.map(c=>c.trim());
      const wi=heads.findIndex(h=>/^단어$/i.test(h));
      const mi=heads.findIndex(h=>/^뜻$/i.test(h));
      const pi=heads.findIndex(h=>/^품사$/i.test(h));
      const di=heads.findIndex(h=>/출처|날짜|date/i.test(h));
      allWords = lines.slice(1).map(l=>csvSplit(l)).filter(v=>v[wi]&&v[mi]).map(v=>({
        day:  di>=0?(v[di]||'').trim():'',
        word: v[wi].trim(),
        meaning: v[mi].trim(),
        pos:  pi>=0?(v[pi]||'').trim():''
      }));
    } else {
      /* 형식 B: 헤더 없음 — 컬럼 수로 판단
         3컬럼: Day, 단어, 뜻
         2컬럼: 단어, 뜻  */
      /* 첫 컬럼이 'Day 숫자' 패턴이면 3컬럼 형식 */
      const isDayFmt = /^Day\s*\d/i.test((firstCols[0]||'').trim());
      allWords = lines.map(l=>{
        const v=csvSplit(l);
        if(isDayFmt){
          const day=(v[0]||'').trim();
          const word=(v[1]||'').trim();
          /* 뜻은 3번째~끝 컬럼 합치기 (뜻 안에 쉼표 있어도 OK) */
          const meaning=v.slice(2).join(',').trim();
          return {day,word,meaning,pos:''};
        } else {
          const word=(v[0]||'').trim();
          const meaning=v.slice(1).join(',').trim();
          return {day:'',word,meaning,pos:''};
        }
      }).filter(w=>w.word&&w.meaning&&!/^Day\s*\d/i.test(w.word));
    }

    if(!allWords.length) throw new Error('단어가 없습니다.');
    renderVocab(allWords);
  } catch(e) {
    document.getElementById('vocab-content').innerHTML=`<div class="loading-box" style="color:#d94040">⚠️ ${e.message}</div>`;
    document.getElementById('count-vocab').textContent='로딩 실패';
  }
}

/* ============================================================
   진도단어 렌더 — Day별 그룹 플래시카드
   ============================================================ */
function renderVocab(words) {
  /* Day 그룹 */
  const groups={};
  words.forEach(w=>{ const d=w.day||'기타'; if(!groups[d])groups[d]=[]; groups[d].push(w); });
  const days = Object.keys(groups);

  document.getElementById('count-vocab').textContent=`전체 ${words.length}개 단어`;
  document.getElementById('vocab-total').textContent=words.length;
  document.getElementById('vocab-days').textContent=days.length;
  document.getElementById('vocab-meta').style.display='flex';

  const box = document.getElementById('vocab-content');
  box.innerHTML='';
  const grid = document.createElement('div');
  grid.className='vocab-grid';

  days.forEach(day => {
    const grp = document.createElement('div');
    grp.className='vocab-day-group';

    const lbl = document.createElement('div');
    lbl.className='day-label';
    lbl.innerHTML=`<span class="day-badge">${esc(day)}</span>${groups[day].length}개 단어`;
    grp.appendChild(lbl);

    const cards = document.createElement('div');
    cards.className='vocab-cards';

    groups[day].forEach(w => {
      const c = document.createElement('div');
      c.className='vcard';
      c.innerHTML=`
        ${w.pos?`<div class="vcard-pos">${esc(w.pos)}</div>`:''}
        <div class="vcard-en">${esc(w.word)}</div>
        <div class="vcard-ko">${esc(w.meaning)}</div>
        <div class="vcard-hint">탭해서 뜻 보기</div>`;
      c.addEventListener('click', ()=>c.classList.toggle('open'));
      cards.appendChild(c);
    });

    grp.appendChild(cards);
    grid.appendChild(grp);
  });

  box.appendChild(grid);
}

function flipAll() {
  allOpen = !allOpen;
  document.querySelectorAll('.vcard').forEach(c=>c.classList.toggle('open', allOpen));
  document.querySelector('.vocab-flip-btn').textContent = allOpen?'전체 닫기':'전체 뒤집기';
}

document.getElementById('search-vocab').addEventListener('input', e=>{
  if(!allWords.length) return;
  const k=e.target.value.trim().toLowerCase();
  renderVocab(k?allWords.filter(w=>w.word.toLowerCase().includes(k)||w.meaning.toLowerCase().includes(k)||w.day.toLowerCase().includes(k)):allWords);
});

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
