<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5f0eb">
<meta name="referrer" content="no-referrer">
<title>오답 Self Test</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f5f0eb;--card:#ffffff;
    --wrong-col:#d94040;--text:#1a1a2e;--text2:#6b6b80;--muted:#b0aab8;
    --border:#e2dcd8;--green:#1a9e6f;--pill-wrong:#fff0f0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);font-family:'Gowun Dodum',sans-serif;color:var(--text);min-height:100vh;-webkit-text-size-adjust:100%;}
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
  #app{max-width:680px;margin:0 auto;padding:14px 16px 24px;}

  /* 헤더 */
  .header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .header-left{min-width:0;}
  .name{font-family:'Space Grotesk',sans-serif;font-size:0.65rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--wrong-col);}
  .title{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:700;color:var(--text);margin-top:2px;letter-spacing:-0.5px;}
  .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  .pill{font-family:'Space Grotesk',sans-serif;font-size:0.55rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:10px;background:var(--pill-wrong);color:var(--wrong-col);border:1px solid #ffcccc;white-space:nowrap;}
  .idx{font-family:'Space Grotesk',sans-serif;font-size:0.95rem;font-weight:700;color:var(--text);}
  .idx span.muted{color:var(--muted);font-weight:400;}

  /* 진행 점 */
  .prog{display:flex;gap:3px;margin-bottom:12px;}
  .dot{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .3s;}
  .dot.correct{background:var(--green);}
  .dot.wrong{background:var(--wrong-col);}
  .dot.current{background:var(--wrong-col);opacity:.5;}

  /* 상태 */
  .status{text-align:center;padding:60px 20px;color:var(--text2);font-size:0.9rem;line-height:1.6;}
  .status .emoji{font-size:2.4rem;margin-bottom:10px;display:block;}

  /* 카드 */
  .card{background:var(--card);border-radius:16px;border:1.5px solid var(--border);box-shadow:0 4px 20px rgba(217,64,64,.06),0 1px 4px rgba(0,0,0,.04);overflow:hidden;position:relative;}
  .card-line{height:4px;background:linear-gradient(90deg,var(--wrong-col) 0%,#ff9980 100%);}
  .card-line.result{background:linear-gradient(90deg,var(--wrong-col) 0%,var(--green) 100%);}

  /* TTS 버튼 */
  .tts-btn{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.9);border:1.5px solid var(--border);color:var(--text2);font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .18s;z-index:10;}
  .tts-btn:active{transform:scale(.88);}
  .tts-btn.playing{border-color:var(--wrong-col);color:var(--wrong-col);background:var(--pill-wrong);}

  /* 카드 내용 */
  .content{padding:18px 20px 14px;}
  .badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
  .badge{font-family:'Space Grotesk',sans-serif;font-size:0.58rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:var(--border);color:var(--text2);}
  .badge.wrong{background:var(--pill-wrong);color:var(--wrong-col);border:1px solid #ffcccc;}
  .prompt{text-align:center;padding:14px 0 18px;}
  .prompt-lbl{font-family:'Space Grotesk',sans-serif;font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  .prompt-word{font-family:'Space Grotesk',sans-serif;font-size:2rem;font-weight:700;color:var(--text);letter-spacing:-1px;line-height:1.15;word-break:break-word;}

  /* 보기 */
  .opts{display:flex;flex-direction:column;gap:8px;}
  .opt{width:100%;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;font-family:'Gowun Dodum',sans-serif;font-size:0.95rem;color:var(--text);cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:11px;line-height:1.4;}
  .opt:active{transform:scale(.98);}
  .opt-key{font-family:'Space Grotesk',sans-serif;font-size:0.72rem;font-weight:700;width:26px;height:26px;border-radius:50%;background:var(--border);color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .18s;}
  @media(hover:hover){
    .opt:hover:not(.disabled){border-color:var(--wrong-col);background:#fff8f8;}
    .opt:hover:not(.disabled) .opt-key{background:var(--wrong-col);color:#fff;}
  }
  .opt.correct{background:#ecfdf5;border-color:var(--green);color:#065f46;}
  .opt.correct .opt-key{background:var(--green);color:#fff;}
  .opt.wrong{background:var(--pill-wrong);border-color:var(--wrong-col);color:#991b1b;}
  .opt.wrong .opt-key{background:var(--wrong-col);color:#fff;}
  .opt.show-answer{background:#ecfdf5;border-color:var(--green);color:#065f46;}
  .opt.show-answer .opt-key{background:var(--green);color:#fff;}
  .opt.disabled{cursor:default;pointer-events:none;}

  /* 피드백 */
  .fb{margin-top:12px;padding:10px 14px;border-radius:12px;font-size:0.82rem;line-height:1.5;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  .fb.correct{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;}
  .fb.wrong{background:var(--pill-wrong);border:1px solid #fecaca;color:#991b1b;}
  .fb-title{font-family:'Space Grotesk',sans-serif;font-size:0.6rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px;}
  .fb-ans{font-weight:600;font-size:0.92rem;}

  /* 진행 액션 (자동 진행 안내 + 즉시 진행 버튼) */
  .next-action{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:10px;animation:fadeIn .3s ease;}
  .next-hint{font-size:0.7rem;color:var(--muted);}
  .next-btn{padding:8px 16px;border:1.5px solid var(--wrong-col);background:var(--wrong-col);color:#fff;border-radius:10px;font-family:'Space Grotesk',sans-serif;font-size:0.72rem;font-weight:700;letter-spacing:0.6px;cursor:pointer;transition:all .15s;}
  .next-btn:active{transform:scale(.95);}
  .next-btn:hover{opacity:.88;}

  /* 결과 화면 */
  .result{padding:24px 20px;text-align:center;}
  .score-circle{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;position:relative;}
  .score-circle::before{content:'';position:absolute;inset:10px;background:#fff;border-radius:50%;}
  .score-inner{position:relative;}
  .score-num{font-family:'Space Grotesk',sans-serif;font-size:2.2rem;font-weight:700;color:var(--text);line-height:1;}
  .score-num span{font-size:1.1rem;}
  .score-tot{font-family:'Space Grotesk',sans-serif;font-size:0.68rem;color:var(--muted);letter-spacing:1px;margin-top:4px;}
  .result-ttl{font-size:1.25rem;color:var(--text);margin-bottom:4px;}
  .result-sub{font-size:0.82rem;color:var(--text2);margin-bottom:14px;}
  .wrong-list{margin-top:10px;text-align:left;display:flex;flex-direction:column;gap:6px;}
  .wrong-list-ttl{font-family:'Space Grotesk',sans-serif;font-size:0.6rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--wrong-col);margin-bottom:4px;}
  .wrong-item{background:var(--pill-wrong);border:1px solid #ffcccc;border-radius:10px;padding:9px 12px;font-size:0.82rem;color:var(--wrong-col);}
  .wrong-word{font-family:'Space Grotesk',sans-serif;font-weight:700;}
  .wrong-meaning{color:var(--text2);margin-left:6px;}
  .actions{margin-top:18px;display:flex;flex-direction:column;gap:8px;}
  .btn{padding:13px 24px;border-radius:14px;font-family:'Space Grotesk',sans-serif;font-size:0.78rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:none;transition:all .15s;text-decoration:none;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--wrong-col);color:#fff;box-shadow:0 4px 16px rgba(217,64,64,0.25);}
  .btn-primary:hover{opacity:.9;}
  .btn-ghost{background:transparent;color:var(--text2);border:1.5px solid var(--border);}
  .btn-ghost:hover{border-color:var(--text2);}

  /* 닫기 링크 (상단) */
  .back-link{display:inline-flex;align-items:center;gap:4px;font-size:0.78rem;color:var(--text2);text-decoration:none;margin-bottom:10px;}
  .back-link:active{color:var(--wrong-col);}

  @media(max-width:380px){
    .prompt-word{font-size:1.7rem;}
    .opt{padding:12px 14px;font-size:0.9rem;}
  }
</style>
</head>
<body>
<div id="app">
  <a href="wrong-words.html" class="back-link">← 폴더로</a>
  <div class="header">
    <div class="header-left">
      <div class="name" id="hdr-name">바로그영어</div>
      <div class="title" id="hdr-title">오답 Self Test</div>
    </div>
    <div class="header-right">
      <span class="pill">Self Test</span>
      <div class="idx"><span id="cur">0</span><span class="muted"> / <span id="tot">0</span></span></div>
    </div>
  </div>
  <div class="prog" id="prog"></div>
  <div id="status" class="status">
    <span class="emoji">⏳</span>
    데이터를 불러오는 중...
  </div>
  <div id="card-wrap"></div>
</div>

<script>
/* ============================================================
   ★ 학생별 설정 — wrong-words.html / wrong-flashcard.html 과 동일하게
   ============================================================ */
const STUDENT_NAME = '조문정';
const SHEET_GID    = '1168557374';
const SHEET_CSV_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQyO-Sx_N0LFENgIcQp-3ATAHrYOUvLCuEr2Nls8qYKYMnOTRyo5_zJY1hbyA1ONfzcf2UK7kwe3fTP/pub?output=csv';
/* ============================================================ */

/* URL 파라미터 파싱 */
const params = new URLSearchParams(location.search);
const PARAM_DATE  = params.get('date') || '';
const PARAM_START = params.get('start') || PARAM_DATE;
const PARAM_END   = params.get('end') || PARAM_DATE;
const PARAM_SET   = params.get('set') || '';
const STARRED_MODE = params.get('starred') === '1';

/* 별표 데이터 storage 키 — wrong-flashcard.html 과 공유 */
const STARRED_KEY = 'starred_words_' + STUDENT_NAME;

/* 전역 상태 */
let queue = [];           // 문제 큐
let pos = 0;              // 현재 위치
let wrongList = [];       // 틀린 문제들
let autoTimer = null;     // 자동 진행 타이머
let _audio = null;

/* ============================================================
   유틸
   ============================================================ */
function parseCSV(text){
  const rows=[];
  let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){
        if(text[i+1]==='"'){cur+='"';i++;}
        else inQ=false;
      } else cur+=ch;
    } else {
      if(ch==='"') inQ=true;
      else if(ch===','){row.push(cur);cur='';}
      else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(ch==='\r'){/* skip */}
      else cur+=ch;
    }
  }
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function normDate(s){
  if(!s) return '';
  const m=String(s).trim().match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if(!m) return '';
  return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
}
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function haptic(ms=8){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(_){}}

function showStatus(emoji, msg) {
  const s = document.getElementById('status');
  s.innerHTML = `<span class="emoji">${emoji}</span>${msg}`;
  s.style.display = 'block';
  document.getElementById('card-wrap').innerHTML = '';
}
function hideStatus() { document.getElementById('status').style.display = 'none'; }

function getStarredCards() {
  try {
    const map = JSON.parse(localStorage.getItem(STARRED_KEY) || '{}');
    return Object.values(map).sort((a,b) => (b.starredAt||0) - (a.starredAt||0));
  } catch { return []; }
}

/* ============================================================
   TTS — Google Translate 발음 (wrong-flashcard 와 동일 패턴)
   ============================================================ */
function ttsPlay(word, btn) {
  /* 토글: 같은 버튼 재클릭 시 정지 */
  if(_audio) {
    try { _audio.pause(); } catch(e){}
    _audio = null;
    document.querySelectorAll('.tts-btn.playing').forEach(b => b.classList.remove('playing'));
    if(btn && btn.dataset.playing === 'true') {
      btn.dataset.playing = '';
      return;
    }
  }
  const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=en&client=tw-ob&q=${encodeURIComponent(word)}`;
  const audio = new Audio(url);
  _audio = audio;
  if(btn) { btn.classList.add('playing'); btn.dataset.playing = 'true'; }
  audio.onended = () => { if(btn){btn.classList.remove('playing');btn.dataset.playing='';} _audio=null; };
  audio.onerror = () => { if(btn){btn.classList.remove('playing');btn.dataset.playing='';} _audio=null; };
  audio.play().catch(() => { if(btn){btn.classList.remove('playing');btn.dataset.playing='';} _audio=null; });
}

/* ============================================================
   객관식 보기 4개 구성
   ============================================================ */
function buildOpts(target, pool) {
  const opts = [target.correct];
  const others = shuffle(pool.filter(w => w.correct !== target.correct));
  for(const w of others){
    if(opts.length >= 4) break;
    if(!opts.includes(w.correct)) opts.push(w.correct);
  }
  return shuffle(opts);
}

/* ============================================================
   진행 점
   ============================================================ */
function buildDots() {
  const wrap = document.getElementById('prog');
  wrap.innerHTML = '';
  for(let i=0; i<queue.length; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    wrap.appendChild(d);
  }
  updateDots();
}
function updateDots() {
  const dots = document.getElementById('prog').children;
  for(let i=0; i<queue.length; i++) {
    const q = queue[i];
    const d = dots[i];
    if(!d) continue;
    d.className = 'dot' + (
      q._result === 'correct' ? ' correct' :
      q._result === 'wrong' ? ' wrong' :
      i === pos ? ' current' : ''
    );
  }
  const cur = document.getElementById('cur');
  const tot = document.getElementById('tot');
  cur.textContent = pos >= queue.length ? '✓' : (pos + 1);
  tot.textContent = queue.length;
}

/* ============================================================
   문제 카드 렌더 — 매번 새 HTML 로 교체 (swap 애니메이션 X, 단순 안정)
   ============================================================ */
function render() {
  /* 자동 타이머가 남아 있으면 정리 */
  if(autoTimer) { clearTimeout(autoTimer); autoTimer = null; }

  /* 결과 화면 분기 */
  if(pos >= queue.length) { renderResult(); return; }

  const q = queue[pos];
  const isAnswered = !!q._result;
  const isOk = q._result === 'correct';

  const optsHTML = q._opts.map((opt, i) => {
    const key = String.fromCharCode(65 + i);
    let cls = 'opt';
    if(isAnswered) {
      cls += ' disabled';
      if(opt === q.correct) cls += isOk ? ' correct' : ' show-answer';
      else if(opt === q._picked) cls += ' wrong';
    }
    return `<button type="button" class="${cls}" data-opt="${esc(opt)}">
              <span class="opt-key">${key}</span><span class="opt-txt">${esc(opt)}</span>
            </button>`;
  }).join('');

  const fbHTML = isAnswered
    ? (isOk
        ? `<div class="fb correct"><div class="fb-title">✓ 정답!</div><div class="fb-ans">${esc(q.word)} — ${esc(q.correct)}</div></div>`
        : `<div class="fb wrong"><div class="fb-title">✗ 오답</div><div class="fb-ans">정답: ${esc(q.correct)}</div></div>`)
    : '';

  const nextActionHTML = isAnswered
    ? `<div class="next-action">
         <span class="next-hint">잠시 후 자동 진행</span>
         <button type="button" class="next-btn" id="next-btn">${pos < queue.length-1 ? '다음 →' : '결과 보기 →'}</button>
       </div>`
    : '';

  document.getElementById('card-wrap').innerHTML = `
    <div class="card">
      <div class="card-line"></div>
      <button type="button" class="tts-btn" id="tts-btn" title="발음 듣기">🔊</button>
      <div class="content">
        <div class="badges">
          <span class="badge wrong">오답</span>
          ${q.pos && q.pos!=='-' ? `<span class="badge">${esc(q.pos)}</span>` : ''}
        </div>
        <div class="prompt">
          <div class="prompt-lbl">English</div>
          <div class="prompt-word">${esc(q.word)}</div>
        </div>
        <div class="opts" id="opts">${optsHTML}</div>
        ${fbHTML}
        ${nextActionHTML}
      </div>
    </div>`;

  /* 이벤트 리스너 등록 */
  const optsEl = document.getElementById('opts');
  if(optsEl) {
    optsEl.querySelectorAll('.opt').forEach(btn => {
      btn.addEventListener('click', () => {
        if(btn.classList.contains('disabled')) return;
        selectAnswer(btn.dataset.opt);
      });
    });
  }
  const ttsBtn = document.getElementById('tts-btn');
  if(ttsBtn) ttsBtn.addEventListener('click', () => ttsPlay(q.word, ttsBtn));

  const nextBtn = document.getElementById('next-btn');
  if(nextBtn) nextBtn.addEventListener('click', () => goNext());

  updateDots();

  /* 새 문제일 때 자동 발음 */
  if(!isAnswered) {
    setTimeout(() => {
      const btn = document.getElementById('tts-btn');
      if(btn) ttsPlay(q.word, btn);
    }, 240);
  }
}

/* ============================================================
   답 선택 → 정답/오답 표시 → 자동 진행 타이머 시작
   ============================================================ */
function selectAnswer(chosen) {
  const q = queue[pos];
  if(q._result) return; // 이미 답한 문제는 무시

  const isOk = chosen === q.correct;
  q._picked = chosen;
  q._result = isOk ? 'correct' : 'wrong';
  if(!isOk) wrongList.push(q);
  haptic(isOk ? 8 : 15);

  /* 화면 다시 그리기 (피드백 + 다음 버튼이 보이도록) */
  render();

  /* ★ 자동 진행 타이머 — 정답 1.0초 / 오답 1.8초 */
  const delay = isOk ? 1000 : 1800;
  if(autoTimer) clearTimeout(autoTimer);
  autoTimer = setTimeout(() => { autoTimer = null; goNext(); }, delay);
}

/* ============================================================
   다음 / 이전 문제로 이동
   ============================================================ */
function goNext() {
  if(autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  if(pos < queue.length) pos++;
  render();
}
function goPrev() {
  if(autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  if(pos > 0) { pos--; render(); }
}

/* ============================================================
   결과 화면
   ============================================================ */
function renderResult() {
  const total = queue.length;
  const correct = queue.filter(q => q._result === 'correct').length;
  const pct = total ? Math.round(100 * correct / total) : 0;
  const col = pct >= 80 ? 'var(--green)' : pct >= 50 ? '#d97a20' : 'var(--wrong-col)';
  const deg = (pct / 100) * 360;

  const wrongHTML = wrongList.length === 0
    ? '<div style="margin-top:14px;color:var(--green);font-size:.88rem">🎉 모두 정답이에요!</div>'
    : `<div class="wrong-list">
         <div class="wrong-list-ttl">틀린 ${wrongList.length}개</div>
         ${wrongList.map(w => `<div class="wrong-item"><span class="wrong-word">${esc(w.word)}</span><span class="wrong-meaning">— ${esc(w.correct)}</span></div>`).join('')}
       </div>`;

  document.getElementById('card-wrap').innerHTML = `
    <div class="card">
      <div class="card-line result"></div>
      <div class="result">
        <div class="score-circle" style="background:conic-gradient(${col} 0deg ${deg}deg,var(--border) ${deg}deg 360deg)">
          <div class="score-inner">
            <div class="score-num">${pct}<span>%</span></div>
            <div class="score-tot">${correct}/${total}</div>
          </div>
        </div>
        <div class="result-ttl">수고했어요! 🎉</div>
        <div class="result-sub">정답률 ${pct}%</div>
        ${wrongHTML}
        <div class="actions">
          <button type="button" class="btn btn-primary" id="restart-btn">↻ 다시 풀기</button>
          <a class="btn btn-ghost" href="wrong-words.html">오답 폴더로 돌아가기</a>
        </div>
      </div>
    </div>`;

  const restartBtn = document.getElementById('restart-btn');
  if(restartBtn) restartBtn.addEventListener('click', restart);
}

/* ============================================================
   다시 풀기 — 같은 큐, 순서만 새로 섞고 보기도 다시 구성
   ============================================================ */
function restart() {
  if(autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  /* 상태 초기화 */
  queue.forEach(q => { q._result = null; q._picked = null; });
  /* 보기 풀은 원본 큐 (정답들)로 다시 구성 */
  const pool = queue.map(q => ({ word:q.word, correct:q.correct, pos:q.pos||'' }));
  queue.forEach(q => { q._opts = buildOpts(q, pool); });
  queue = shuffle(queue);
  pos = 0;
  wrongList = [];
  buildDots();
  render();
}

/* ============================================================
   키보드 단축키 — 답 선택 후엔 → 키로 다음 / ← 키로 이전
   ============================================================ */
document.addEventListener('keydown', (e) => {
  if(!queue.length) return;
  const curQ = queue[pos];
  if(e.key === 'ArrowRight' && curQ && curQ._result) {
    e.preventDefault();
    goNext();
  } else if(e.key === 'ArrowLeft' && pos > 0) {
    e.preventDefault();
    goPrev();
  }
});

/* ============================================================
   데이터 로딩 — 모드 분기 (별표 / 날짜+세트)
   ============================================================ */
async function loadData() {
  document.getElementById('hdr-name').textContent = `바로그영어 · ${STUDENT_NAME}`;
  document.title = `오답 Self Test – ${STUDENT_NAME}`;

  /* ----- 모드 1: 별표 단어 Self Test ----- */
  if(STARRED_MODE) {
    document.getElementById('hdr-title').textContent = '⭐ 별표 단어 · Self Test';
    const starred = getStarredCards();
    if(!starred.length) {
      showStatus('⭐', '아직 별표한 단어가 없어요.<br><span style="font-size:0.78rem;color:var(--muted)">플래시카드에서 ☆ 버튼으로 표시해 주세요</span>');
      return;
    }
    const cards = starred.map(s => ({
      word:    s.word,
      correct: s.correct,
      pos:     s.pos || ''
    }));
    /* 보기 풀: 별표 단어 자체 + 4개 미만이면 시트에서 다른 오답들로 보충 */
    let optsPool = cards.slice();
    if(optsPool.length < 4) {
      showStatus('⏳', '보기를 만들기 위해 다른 오답 단어를 불러오는 중...');
      try {
        const res = await fetch(`${SHEET_CSV_BASE}&gid=${SHEET_GID}&t=${Date.now()}`);
        if(res.ok) {
          const rows = parseCSV(await res.text());
          let startRow = 0;
          if(rows.length && String(rows[0][0]||'').trim()==='날짜') startRow = 1;
          for(let i=startRow; i<rows.length; i++){
            const r = rows[i];
            if(!r || r.length<5) continue;
            const word = String(r[2]||'').trim();
            const correct = String(r[4]||'').trim();
            if(!word || !correct) continue;
            if(optsPool.some(c => c.correct === correct)) continue;
            optsPool.push({ word, correct, pos: String(r[5]||'').trim() });
            if(optsPool.length >= 30) break; // 충분히 모이면 중단
          }
        }
      } catch(e) { console.warn('보기 풀 보충 실패:', e); }
    }
    if(optsPool.length < 4) {
      showStatus('📊', `객관식 4지선다를 만들기에 단어가 부족해요.<br><span style="font-size:0.78rem;color:var(--muted)">별표 ${cards.length}개 / 전체 풀 ${optsPool.length}개</span>`);
      return;
    }
    queue = cards.map(w => ({
      word: w.word, correct: w.correct, pos: w.pos,
      _opts: buildOpts(w, optsPool),
      _result: null, _picked: null
    }));
    queue = shuffle(queue);
    pos = 0; wrongList = [];
    hideStatus();
    buildDots();
    render();
    return;
  }

  /* ----- 모드 2: 날짜+세트 Self Test (시트 fetch) ----- */
  if(!PARAM_START) {
    showStatus('⚠️', '날짜 정보가 없어요.<br><span style="font-size:0.8rem;color:var(--muted)">예: wrong-quiz.html?date=2026-05-17</span>');
    return;
  }
  showStatus('⏳', '데이터를 불러오는 중...');
  try {
    const res = await fetch(`${SHEET_CSV_BASE}&gid=${SHEET_GID}&t=${Date.now()}`);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = parseCSV(await res.text());
    let startRow = 0;
    if(rows.length && String(rows[0][0]||'').trim()==='날짜') startRow = 1;

    const cards = [];
    let groupTitle = '';
    for(let i=startRow; i<rows.length; i++) {
      const r = rows[i];
      if(!r || r.length<5) continue;
      const dateStr = normDate(r[0]);
      if(!dateStr) continue;
      if(dateStr < PARAM_START || dateStr > PARAM_END) continue;
      const set = String(r[8]||'').trim();
      if(PARAM_SET && set !== PARAM_SET) continue;
      const word = String(r[2]||'').trim();
      const correct = String(r[4]||'').trim();
      const pos = String(r[5]||'').trim();
      const title = String(r[9]||'').trim();
      if(!word || !correct) continue;
      if(!groupTitle && title) groupTitle = title;
      cards.push({ word, correct, pos: pos||'' });
    }

    if(cards.length === 0) {
      showStatus('📭', `${STUDENT_NAME}의 오답 데이터가 없어요.`);
      return;
    }
    if(cards.length < 4) {
      showStatus('📊', `객관식 4지선다를 만들기에 단어가 부족해요.<br><span style="font-size:0.78rem;color:var(--muted)">현재 ${cards.length}개</span>`);
      return;
    }

    const p = PARAM_START.split('-');
    const subTitle = groupTitle || `${parseInt(p[1])}월 ${parseInt(p[2])}일 오답`;
    document.getElementById('hdr-title').textContent = `${subTitle} · Self Test`;

    queue = cards.map(w => ({
      word: w.word, correct: w.correct, pos: w.pos,
      _opts: buildOpts(w, cards),
      _result: null, _picked: null
    }));
    queue = shuffle(queue);
    pos = 0; wrongList = [];
    hideStatus();
    buildDots();
    render();
  } catch(err) {
    showStatus('⚠️', `데이터를 불러오지 못했어요.<br><span style="font-size:0.78rem;color:var(--muted)">${err.message}</span>`);
  }
}

loadData();
</script>
