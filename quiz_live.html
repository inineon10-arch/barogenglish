<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f0eb">
<title>단어 퀴즈 — 오답 단어장</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f0eb;--card:#ffffff;--accent:#2d5be3;--accent2:#e3502d;--green:#1a9e6f;--text:#1a1a2e;--text2:#6b6b80;--muted:#b0aab8;--border:#e2dcd8;--tip-bg:#eef3ff;--pill-wrong:#fff0f0;--wrong-col:#d94040;--yellow:#f59e0b;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:var(--bg);font-family:'Gowun Dodum',sans-serif;color:var(--text);overflow:hidden;-webkit-text-size-adjust:100%;overscroll-behavior:none;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
.header{flex-shrink:0;padding:12px 16px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;}
.header-left .name{font-family:'Space Grotesk',sans-serif;font-size:.62rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);}
.header-left .title{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:700;color:var(--text);margin-top:2px;letter-spacing:-.5px;}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.score-display{font-family:'Space Grotesk',sans-serif;font-size:.9rem;font-weight:700;color:var(--text);}
.score-display span{color:var(--muted);font-weight:400;}
.tab-bar{flex-shrink:0;padding:0 16px 10px;display:flex;gap:6px;flex-wrap:wrap;}
.tab-btn{font-family:'Space Grotesk',sans-serif;font-size:.62rem;font-weight:600;padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all .2s;min-height:34px;touch-action:manipulation;letter-spacing:.5px;text-transform:uppercase;}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.toolbar{flex-shrink:0;padding:0 16px 10px;display:flex;align-items:center;gap:8px;}
.shuffle-btn{font-family:'Space Grotesk',sans-serif;font-size:.6rem;font-weight:700;padding:8px 13px;border-radius:18px;border:1.5px solid var(--accent2);background:transparent;color:var(--accent2);cursor:pointer;transition:all .2s;min-height:34px;touch-action:manipulation;display:inline-flex;align-items:center;gap:4px;}
.shuffle-btn.on{background:var(--accent2);color:#fff;}
.count-info{font-family:'Space Grotesk',sans-serif;font-size:.7rem;color:var(--muted);margin-left:auto;}
.prog-wrap{flex-shrink:0;padding:0 16px 10px;}
.prog-bar{height:4px;background:var(--border);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px;transition:width .4s ease;}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:thin;padding:0 16px 16px;}
.content::-webkit-scrollbar{width:3px;}
.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.status-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:200px;color:var(--muted);font-family:'Space Grotesk',sans-serif;text-align:center;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.status-box .msg{font-size:.78rem;letter-spacing:1px;}
/* 플래시카드 */
.flash-card{background:var(--card);border-radius:22px;border:1.5px solid var(--border);box-shadow:0 8px 40px rgba(45,91,227,.08),0 2px 8px rgba(0,0,0,.05);overflow:hidden;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;position:relative;}
.card-line{height:4px;background:linear-gradient(90deg,var(--wrong-col) 0%,#ff9980 100%);}
.card-body{padding:20px 18px 16px;}
.card-badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;}
.badge{font-family:'Space Grotesk',sans-serif;font-size:.58rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:20px;}
.b-num{background:var(--border);color:var(--text2);}
.b-pos{background:#f0f0ff;color:var(--accent);border:1px solid #d0d8ff;}
.b-src{background:#fff8f0;color:var(--yellow);border:1px solid #ffe4b0;}
.card-main{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 0 12px;min-height:120px;gap:6px;}
.card-label{font-family:'Space Grotesk',sans-serif;font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.card-word{font-family:'Space Grotesk',sans-serif;font-size:2rem;font-weight:700;color:var(--text);letter-spacing:-1px;line-height:1.1;word-break:break-word;}
.card-meaning{font-size:1.7rem;font-weight:400;color:var(--text);line-height:1.3;letter-spacing:-.5px;}
.card-pos{font-size:.76rem;color:var(--text2);margin-top:2px;}
.tip-box{background:var(--tip-bg);border-left:3px solid var(--accent);border-radius:0 12px 12px 0;padding:9px 13px;font-size:.86rem;color:#3a5ab0;line-height:1.6;margin-top:10px;}
.tip-title{font-family:'Space Grotesk',sans-serif;font-size:.58rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:5px;}
.example-box{background:#faf8f5;border:1px solid var(--border);border-radius:12px;padding:9px 13px;font-size:.84rem;color:var(--text2);line-height:1.65;font-style:italic;margin-top:7px;}
.tap-hint{text-align:center;font-size:.62rem;color:var(--muted);letter-spacing:.5px;padding-top:8px;padding-bottom:2px;display:flex;align-items:center;justify-content:center;gap:5px;}
.tap-hint::before,.tap-hint::after{content:'';display:inline-block;width:18px;height:1px;background:var(--border);}
.tts-btn{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.9);border:1.5px solid var(--border);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:1rem;transition:all .18s;touch-action:manipulation;z-index:10;backdrop-filter:blur(4px);}
.tts-btn:active{transform:scale(.88);}
.tts-btn.playing{border-color:var(--accent);color:var(--accent);background:var(--tip-bg);}
.card-nav{display:flex;justify-content:space-between;align-items:center;padding:10px 0 0;}
.nav-btn{font-family:'Space Grotesk',sans-serif;font-size:.62rem;font-weight:600;padding:9px 16px;border-radius:14px;border:1.5px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;transition:all .2s;touch-action:manipulation;display:flex;align-items:center;gap:5px;}
.nav-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.card-counter{font-family:'Space Grotesk',sans-serif;font-size:.85rem;font-weight:700;color:var(--text);}
.card-counter span{color:var(--muted);font-weight:400;}
/* 객관식 */
.quiz-card{background:var(--card);border-radius:22px;border:1.5px solid var(--border);padding:20px 18px;box-shadow:0 4px 20px rgba(45,91,227,.06);}
.quiz-num{font-family:'Space Grotesk',sans-serif;font-size:.6rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.quiz-question{font-size:1.1rem;font-weight:400;color:var(--text);line-height:1.55;margin-bottom:18px;}
.quiz-q-word{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:700;color:var(--text);display:block;margin-bottom:8px;}
.options{display:flex;flex-direction:column;gap:8px;}
.option-btn{background:#faf8f5;border:1.5px solid var(--border);border-radius:14px;padding:12px 16px;font-size:.88rem;color:var(--text);cursor:pointer;text-align:left;transition:all .18s;line-height:1.4;touch-action:manipulation;display:flex;align-items:center;gap:10px;}
.option-btn.correct{border-color:var(--green);background:#f0faf6;color:var(--green);}
.option-btn.wrong{border-color:var(--wrong-col);background:var(--pill-wrong);color:var(--wrong-col);}
.option-btn.disabled{pointer-events:none;}
.option-mark{font-family:'Space Grotesk',sans-serif;font-size:.65rem;font-weight:700;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--border);color:var(--text2);}
.option-btn.correct .option-mark{background:var(--green);color:#fff;}
.option-btn.wrong .option-mark{background:var(--wrong-col);color:#fff;}
.quiz-feedback{margin-top:14px;padding:12px 16px;border-radius:14px;font-size:.84rem;line-height:1.6;display:none;}
.quiz-feedback.correct{background:#f0faf6;border:1px solid #b8e8d4;color:#1a7a55;}
.quiz-feedback.wrong{background:var(--pill-wrong);border:1px solid #ffcccc;color:var(--wrong-col);}
.quiz-next-btn{width:100%;margin-top:12px;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:16px;font-family:'Space Grotesk',sans-serif;font-size:.85rem;font-weight:700;letter-spacing:.5px;cursor:pointer;touch-action:manipulation;display:none;}
.quiz-next-btn.show{display:block;}
/* 주관식 */
.sa-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font-family:'Gowun Dodum',sans-serif;font-size:1rem;color:var(--text);background:#faf8f5;outline:none;transition:border-color .2s;margin-top:12px;}
.sa-input:focus{border-color:var(--accent);}
.sa-input.correct{border-color:var(--green);background:#f0faf6;}
.sa-input.wrong{border-color:var(--wrong-col);background:var(--pill-wrong);}
.sa-submit-btn{width:100%;margin-top:10px;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:16px;font-family:'Space Grotesk',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;touch-action:manipulation;}
.sa-submit-btn:disabled{background:var(--muted);}
/* 결과 */
.result-card{background:var(--card);border-radius:22px;border:1.5px solid var(--border);padding:28px 22px;text-align:center;box-shadow:0 8px 40px rgba(45,91,227,.08);}
.result-line{height:4px;border-radius:22px 22px 0 0;margin:-28px -22px 24px;background:linear-gradient(90deg,var(--accent) 0%,#6a8eff 50%,var(--green) 100%);}
.result-emoji{font-size:3.2rem;line-height:1;animation:pop .6s cubic-bezier(.175,.885,.32,1.275);}
@keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.result-label{font-family:'Space Grotesk',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-top:12px;}
.result-score{font-size:2.8rem;font-weight:400;color:var(--text);margin:4px 0;line-height:1.1;}
.result-score strong{font-weight:700;color:var(--accent);}
.result-sub{font-size:.85rem;color:var(--text2);line-height:1.6;margin-top:8px;}
.restart-btn{margin-top:20px;padding:14px 32px;background:var(--accent);color:#fff;border:none;border-radius:16px;font-family:'Space Grotesk',sans-serif;font-size:.85rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 16px rgba(45,91,227,.25);min-height:48px;display:inline-flex;align-items:center;gap:8px;touch-action:pan-y;}
/* 목록 */
.word-item{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px;}
.word-item-num{font-family:'Space Grotesk',sans-serif;font-size:.62rem;font-weight:700;color:var(--muted);min-width:24px;margin-top:3px;}
.word-item-body{flex:1;min-width:0;}
.word-item-en{font-family:'Space Grotesk',sans-serif;font-size:.95rem;font-weight:700;color:var(--text);}
.word-item-ko{font-size:.82rem;color:var(--text2);margin-top:2px;}
.word-item-pos{font-family:'Space Grotesk',sans-serif;font-size:.6rem;background:#f0f0ff;color:var(--accent);border:1px solid #d0d8ff;border-radius:10px;padding:2px 7px;display:inline-block;margin-top:4px;}
@media(max-height:700px){.card-word{font-size:1.75rem}.card-meaning{font-size:1.5rem}.card-main{min-height:90px;padding:12px 0 8px}.tip-box,.example-box{font-size:.78rem;padding:8px 11px}}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-left">
      <div class="name" id="app-name">오답 단어장 · 퀴즈</div>
      <div class="title" id="app-title">단어 학습</div>
    </div>
    <div class="header-right">
      <div class="score-display" id="score-display">0<span> / 0</span></div>
    </div>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-flash" onclick="switchTab('flash')">📚 플래시카드</button>
    <button class="tab-btn" id="tab-mc" onclick="switchTab('mc')">🔵 객관식</button>
    <button class="tab-btn" id="tab-sa" onclick="switchTab('sa')">✏️ 주관식</button>
    <button class="tab-btn" id="tab-list" onclick="switchTab('list')">📋 목록</button>
  </div>
  <div class="toolbar">
    <button class="shuffle-btn" id="shuffle-btn" onclick="toggleShuffle()">🔀 섞기</button>
    <span class="count-info" id="count-info"></span>
  </div>
  <div class="prog-wrap">
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div class="content" id="main-content">
    <div class="status-box"><div class="spinner"></div><div class="msg">단어 불러오는 중...</div></div>
  </div>
</div>
<script>
const SHEET_CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vSwVyD25PYnOiPEOZhMGy2ZQpt8jQmG6DYM7mXB_2FaR2hCPDTk8kmqAUT4xiUSO-fHhT56N4symdII/pub?output=csv';
const WEBAPP_URL='https://script.google.com/macros/s/AKfycbx5Y3daCCYcLP5WXsusQtrQmIpHrb1t7DyNqbIGRNYGDvY74ZZ4c9tY_iATFX2krDHHA/exec';
const _p=new URLSearchParams(location.search);
const _student=_p.get('student')||'';
const _start=_p.get('start')||'';
const _end=_p.get('end')||_start;
const _mode=_p.get('mode')||'sheet';

let allWords=[],words=[],isShuffled=false,currentTab='flash';
let fcIdx=0,fcFlipped=false,currentAudio=null;
let mcIdx=0,mcScore=0,mcAnswered=false;
let saIdx=0,saScore=0,saAnswered=false;

function parseCSV(text){
  const lines=text.trim().split('\n');
  const headers=splitLine(lines[0]);
  return lines.slice(1).map(l=>{
    const vals=splitLine(l),obj={};
    headers.forEach((h,i)=>obj[h.trim()]=(vals[i]||'').trim());
    return obj;
  });
}
function splitLine(l){
  const r=[];let cur='',inQ=false;
  for(const c of l){if(c==='"'){inQ=!inQ;}else if(c===','&&!inQ){r.push(cur);cur='';}else{cur+=c;}}
  r.push(cur);return r;
}

async function loadWords(){
  setHTML('<div class="status-box"><div class="spinner"></div><div class="msg">단어 불러오는 중...</div></div>');
  try{
    if(_mode==='student'&&_student&&_start){
      const res=await fetch(`${WEBAPP_URL}?student=${encodeURIComponent(_student)}&start=${encodeURIComponent(_start)}&end=${encodeURIComponent(_end)}`);
      const data=await res.json();
      if(data.error)throw new Error(data.error);
      allWords=(data.words||[]).map((w,i)=>({id:i+1,word:w.word,meaning:w.correct,pos:w.pos||'',tip:w.tip||'',example:w.example||'',source:data.startDate||''}));
      document.getElementById('app-name').textContent=`오답 단어장 · ${_student}`;
      document.getElementById('app-title').textContent=`${_start} 오답 퀴즈`;
    }else{
      const res=await fetch(SHEET_CSV);
      if(!res.ok)throw new Error('시트를 불러올 수 없습니다.');
      const rows=parseCSV(await res.text());
      allWords=rows.filter(r=>r['단어']&&r['뜻']).map((r,i)=>({
        id:i+1,word:r['단어'],meaning:r['뜻'],pos:r['품사']||'',
        tip:r['암기팁']||'',example:r['예문']||'',source:r['출처날짜']||''
      }));
      document.getElementById('app-name').textContent='오답 단어장 · 전체';
      document.getElementById('app-title').textContent='단어 퀴즈';
    }
    if(!allWords.length)throw new Error('단어가 없습니다.');
    words=[...allWords];
    document.getElementById('count-info').textContent=`총 ${words.length}개 단어`;
    renderTab();
  }catch(e){setHTML(`<div class="status-box"><div style="font-size:2rem">⚠️</div><div class="msg" style="color:var(--wrong-col)">${e.message}</div></div>`);}
}

function setHTML(h){document.getElementById('main-content').innerHTML=h;}
function updateProg(cur,tot){
  document.getElementById('prog-fill').style.width=(tot>0?Math.round(cur/tot*100):0)+'%';
  document.getElementById('score-display').innerHTML=`${cur}<span> / ${tot}</span>`;
}
function switchTab(t){
  currentTab=t;
  ['flash','mc','sa','list'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('active',x===t));
  fcIdx=0;fcFlipped=false;mcIdx=0;mcScore=0;mcAnswered=false;saIdx=0;saScore=0;saAnswered=false;
  renderTab();
}
function renderTab(){
  if(currentTab==='flash')renderFC();
  else if(currentTab==='mc')renderMC();
  else if(currentTab==='sa')renderSA();
  else renderList();
}
function toggleShuffle(){
  isShuffled=!isShuffled;
  document.getElementById('shuffle-btn').classList.toggle('on',isShuffled);
  document.getElementById('shuffle-btn').textContent=isShuffled?'🔀 섞기 ON':'🔀 섞기';
  words=isShuffled?shuffle([...allWords]):[...allWords];
  fcIdx=0;fcFlipped=false;mcIdx=0;mcScore=0;saIdx=0;saScore=0;renderTab();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function h(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hA(s){if(!s)return'';return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;');}

// ── 플래시카드 ──
function renderFC(){
  updateProg(fcIdx,words.length);
  if(fcIdx>=words.length){setHTML(`<div class="result-card"><div class="result-line"></div><div class="result-emoji">🎉</div><div class="result-label">All Done</div><div class="result-score"><strong>${words.length}</strong>개</div><div class="result-sub">모든 단어 확인 완료!<br>퀴즈로 실력을 테스트해보세요 💪</div><button class="restart-btn" onclick="fcIdx=0;fcFlipped=false;renderFC()">↺ 처음부터</button></div>`);return;}
  const w=words[fcIdx];
  const front=`<div class="flash-card" onclick="flipFC()"><div class="card-line"></div><div class="card-body"><div class="card-badges"><span class="badge b-num">#${w.id}</span>${w.pos?`<span class="badge b-pos">${h(w.pos)}</span>`:''} ${w.source?`<span class="badge b-src">${h(w.source.replace('2026-',''))}</span>`:''}</div><div class="card-main"><div class="card-label">영단어</div><div class="card-word">${h(w.word)}</div>${w.pos?`<div class="card-pos">${h(w.pos)}</div>`:''}</div><div class="tap-hint">탭하면 뜻 보기</div></div><button class="tts-btn" onclick="event.stopPropagation();tts(this,'${hA(w.word)}')">🔊</button></div>`;
  const back=`<div class="flash-card" onclick="flipFC()"><div class="card-line"></div><div class="card-body"><div class="card-badges"><span class="badge b-num">#${w.id}</span>${w.pos?`<span class="badge b-pos">${h(w.pos)}</span>`:''}</div><div class="card-main"><div class="card-label">뜻</div><div class="card-meaning">${h(w.meaning)}</div></div><div style="text-align:center;font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:700;margin:8px 0">${h(w.word)}</div>${w.tip?`<div class="tip-box"><div class="tip-title">💡 암기팁</div>${h(w.tip)}</div>`:''} ${w.example?`<div class="example-box">${h(w.example)}</div>`:''}<div class="tap-hint">탭하면 단어로</div></div><button class="tts-btn" onclick="event.stopPropagation();tts(this,'${hA(w.word)}')">🔊</button></div>`;
  setHTML(`${fcFlipped?back:front}<div class="card-nav"><button class="nav-btn" onclick="fcPrev()" ${fcIdx===0?'disabled style="opacity:.4"':''}>← 이전</button><span class="card-counter">${fcIdx+1}<span> / ${words.length}</span></span><button class="nav-btn primary" onclick="fcNext()">다음 →</button></div>`);
  if(!fcFlipped)setTimeout(()=>{const b=document.querySelector('.tts-btn');if(b)tts(b,w.word);},200);
}
function flipFC(){fcFlipped=!fcFlipped;renderFC();}
function fcPrev(){if(fcIdx>0){fcIdx--;fcFlipped=false;renderFC();}}
function fcNext(){fcIdx++;fcFlipped=false;renderFC();}

// ── 객관식 ──
function renderMC(){
  updateProg(mcIdx,words.length);
  if(mcIdx>=words.length){endScreen('객관식',mcScore);return;}
  const w=words[mcIdx];
  const wrong3=shuffle(words.filter((_,i)=>i!==mcIdx)).slice(0,3).map(x=>x.meaning);
  const opts=shuffle([w.meaning,...wrong3]);
  setHTML(`<div class="quiz-card"><div class="quiz-num">문제 ${mcIdx+1} / ${words.length}</div><div class="quiz-question"><span class="quiz-q-word">${h(w.word)}</span>다음 중 올바른 뜻은?</div><div class="options">${opts.map((o,i)=>`<button class="option-btn" id="opt${i}" onclick="pickMC(${i},'${hA(o)}','${hA(w.meaning)}')"><span class="option-mark">${['A','B','C','D'][i]}</span><span>${h(o)}</span></button>`).join('')}</div><div class="quiz-feedback" id="fb"></div><button class="quiz-next-btn" id="mc-next" onclick="mcIdx++;renderMC()">${mcIdx+1<words.length?'다음 문제 →':'결과 보기 🏁'}</button></div>`);
  mcAnswered=false;
}
function pickMC(idx,chosen,correct){
  if(mcAnswered)return;mcAnswered=true;
  const ok=chosen===correct;if(ok)mcScore++;
  document.querySelectorAll('.option-btn').forEach(b=>{b.classList.add('disabled');if(b.querySelector('span:last-child').textContent.trim()===correct)b.classList.add('correct');});
  if(!ok)document.getElementById('opt'+idx).classList.add('wrong');
  const w=words[mcIdx],fb=document.getElementById('fb');
  fb.className='quiz-feedback '+(ok?'correct':'wrong');
  fb.innerHTML=ok?`✅ 정답! <strong>${h(correct)}</strong>${w.tip?`<br><small>💡 ${h(w.tip)}</small>`:''}`:`❌ 정답: <strong>${h(correct)}</strong>${w.tip?`<br><small>💡 ${h(w.tip)}</small>`:''}`;
  fb.style.display='block';
  document.getElementById('mc-next').classList.add('show');
}

// ── 주관식 ──
function renderSA(){
  updateProg(saIdx,words.length);
  if(saIdx>=words.length){endScreen('주관식',saScore);return;}
  const w=words[saIdx];
  setHTML(`<div class="quiz-card"><div class="quiz-num">문제 ${saIdx+1} / ${words.length}</div><div class="quiz-question"><span class="quiz-q-word">${h(w.word)}</span>뜻을 한국어로 입력하세요.${w.pos?` <span class="badge b-pos" style="display:inline-block">${h(w.pos)}</span>`:''}</div><input type="text" class="sa-input" id="sa-in" placeholder="뜻을 입력하세요..." oninput="document.getElementById('sa-ok').disabled=!this.value.trim()" onkeydown="if(event.key==='Enter')saCheck()"><div class="quiz-feedback" id="fb-sa"></div><button class="sa-submit-btn" id="sa-ok" onclick="saCheck()" disabled>확인</button></div>`);
  saAnswered=false;
  setTimeout(()=>{const i=document.getElementById('sa-in');if(i)i.focus();},100);
}
function saCheck(){
  if(saAnswered){saIdx++;renderSA();return;}
  const inp=document.getElementById('sa-in');if(!inp||!inp.value.trim())return;
  saAnswered=true;
  const w=words[saIdx];
  const user=inp.value.trim().toLowerCase().replace(/[,;\s·]+/g,'');
  const kwds=w.meaning.split(/[,;·\/]+/).map(s=>s.trim().toLowerCase().replace(/[()（）\s~\-]+/g,''));
  const ok=kwds.some(k=>k&&(user.includes(k)||k.includes(user.replace(/[()（）\s~\-]+/g,''))));
  if(ok)saScore++;
  inp.classList.add(ok?'correct':'wrong');inp.disabled=true;
  const fb=document.getElementById('fb-sa');
  fb.className='quiz-feedback '+(ok?'correct':'wrong');
  fb.innerHTML=ok?`✅ 정답! <strong>${h(w.meaning)}</strong>${w.tip?`<br><small>💡 ${h(w.tip)}</small>`:''}`:`❌ 정답: <strong>${h(w.meaning)}</strong>${w.tip?`<br><small>💡 ${h(w.tip)}</small>`:''}`;
  fb.style.display='block';
  const btn=document.getElementById('sa-ok');
  btn.textContent=saIdx+1<words.length?'다음 문제 →':'결과 보기 🏁';
  btn.disabled=false;
}

// ── 목록 ──
function renderList(){
  updateProg(0,0);
  setHTML(words.map(w=>`<div class="word-item"><div class="word-item-num">${w.id}</div><div class="word-item-body"><div class="word-item-en">${h(w.word)}</div><div class="word-item-ko">${h(w.meaning)}</div>${w.pos?`<span class="word-item-pos">${h(w.pos)}</span>`:''}</div></div>`).join(''));
}

function endScreen(label,score){
  const pct=Math.round(score/words.length*100);
  const emoji=pct>=90?'🏆':pct>=70?'🎯':pct>=50?'💪':'📖';
  setHTML(`<div class="result-card"><div class="result-line"></div><div class="result-emoji">${emoji}</div><div class="result-label">${label} 결과</div><div class="result-score"><strong>${score}</strong> / ${words.length}</div><div class="result-sub">${pct}% 정확도<br>${pct>=80?'훌륭해요! 🎉':pct>=60?'잘 하고 있어요! 조금 더 복습해봐요.':'플래시카드로 다시 복습해 보세요!'}</div><button class="restart-btn" onclick="${label==='객관식'?'mcIdx=0;mcScore=0;renderMC()':'saIdx=0;saScore=0;renderSA()'}">↺ 다시 풀기</button></div>`);
  updateProg(words.length,words.length);
}

// ── TTS ──
function tts(btn,word){
  if(currentAudio){currentAudio.pause();currentAudio=null;document.querySelectorAll('.tts-btn.playing').forEach(b=>{b.classList.remove('playing');b.dataset.playing='';});if(btn&&btn.dataset.playing==='true'){btn.dataset.playing='';return;}}
  if(!btn)return;
  btn.classList.add('playing');btn.dataset.playing='true';
  const audio=new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&tl=en&client=tw-ob&q=${encodeURIComponent(word)}`);
  currentAudio=audio;
  const done=()=>{btn.classList.remove('playing');btn.dataset.playing='';currentAudio=null;};
  audio.onended=done;audio.onerror=done;
  audio.play().catch(done);
}

loadWords();
</script>
