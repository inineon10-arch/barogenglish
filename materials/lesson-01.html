<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f0eb">
<title>오답 단어장 - 강응찬</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0eb; --card: #ffffff; --accent: #2d5be3; --accent2: #e3502d;
    --wrong-col: #d94040; --blank-col: #d97a20;
    --text: #1a1a2e; --text2: #6b6b80; --muted: #b0aab8; --border: #e2dcd8;
    --tip-bg: #eef3ff; --ex-bg: #faf8f5; --green: #1a9e6f;
    --pill-wrong: #fff0f0; --pill-blank: #fff5e8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body { width: 100%; height: 100%; background: var(--bg); font-family: 'Gowun Dodum', sans-serif; color: var(--text); overflow: hidden; -webkit-text-size-adjust: 100%; overscroll-behavior: none; touch-action: pan-y; }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
  .header { flex-shrink: 0; padding: 12px 16px 8px; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  .header-left { min-width: 0; flex: 1; }
  .header-left .name { font-family: 'Space Grotesk', sans-serif; font-size: 0.65rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); }
  .header-left .title { font-family: 'Space Grotesk', sans-serif; font-size: 1.15rem; font-weight: 700; color: var(--text); margin-top: 2px; letter-spacing: -0.5px; }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .index-display { font-family: 'Space Grotesk', sans-serif; font-size: 0.95rem; font-weight: 700; color: var(--text); }
  .index-display span { color: var(--muted); font-weight: 400; }
  .prog-wrap { flex-shrink: 0; padding: 0 16px 10px; }
  .prog-dots { display: flex; justify-content: space-between; gap: 3px; }
  .pdot { flex: 1; height: 4px; border-radius: 3px; background: var(--border); transition: background 0.3s; }
  .pdot.done { background: var(--accent); }
  .pdot.current { background: var(--accent); opacity: 0.4; }
  .pdot.done.all { background: var(--green); }
  .card-viewport { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 0; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .flash-card { position: absolute; width: calc(100% - 24px); max-width: 430px; height: calc(100% - 10px); max-height: 620px; will-change: transform, opacity; cursor: pointer; touch-action: pan-y; transition: transform 0.32s cubic-bezier(.4,0,.2,1), opacity 0.32s; }
  .flash-card.no-transition { transition: none !important; }
  .flash-card.dragging { transition: none !important; }
  .card-face { width: 100%; height: 100%; background: var(--card); border-radius: 22px; border: 1.5px solid var(--border); box-shadow: 0 8px 40px rgba(45,91,227,0.08), 0 2px 8px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; }
  .card-line { height: 4px; flex-shrink: 0; border-radius: 22px 22px 0 0; }
  .line-wrong { background: linear-gradient(90deg, var(--wrong-col) 0%, #ff9980 100%); }
  .line-blank { background: linear-gradient(90deg, var(--blank-col) 0%, #ffd080 100%); }
  .card-content { flex: 1; padding: 16px 18px 12px; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
  .face-meaning, .face-word { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .scroll-area { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; scrollbar-width: thin; }
  .scroll-area::-webkit-scrollbar { width: 3px; }
  .scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .badges { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; flex-shrink: 0; }
  .badge { font-family: 'Space Grotesk', sans-serif; font-size: 0.58rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; padding: 3px 9px; border-radius: 20px; }
  .b-num { background: var(--border); color: var(--text2); }
  .b-wrong { background: var(--pill-wrong); color: var(--wrong-col); border: 1px solid #ffcccc; }
  .b-blank { background: var(--pill-blank); color: var(--blank-col); border: 1px solid #ffddb0; }
  .b-pos { background: #f0f0ff; color: var(--accent); border: 1px solid #d0d8ff; }
  .b-src1 { background: #f0fff8; color: #1a9e6f; border: 1px solid #b0e8cc; }
  .b-src2 { background: #f5f0ff; color: #6a3fb5; border: 1px solid #d0b8ff; }
  .meaning-center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 8px; padding: 10px 0; min-height: 120px; }
  .meaning-label { font-family: 'Space Grotesk', sans-serif; font-size: 0.58rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .meaning-text { font-size: 1.85rem; font-weight: 400; color: var(--text); line-height: 1.3; letter-spacing: -0.5px; }
  .word-center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 6px; padding: 10px 0; min-height: 120px; }
  .word-label { font-family: 'Space Grotesk', sans-serif; font-size: 0.58rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .word-text { font-family: 'Space Grotesk', sans-serif; font-size: 2.4rem; font-weight: 700; color: var(--text); letter-spacing: -1px; line-height: 1.1; word-break: break-word; }
  .word-pos { font-size: 0.76rem; color: var(--text2); margin-top: 2px; }
  .student-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 12px; background: var(--pill-wrong); border-radius: 10px; border: 1px solid #ffcccc; flex-shrink: 0; }
  .student-row.blank-row { background: var(--pill-blank); border-color: #ffddb0; }
  .student-label { font-family: 'Space Grotesk', sans-serif; font-size: 0.58rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--wrong-col); flex-shrink: 0; }
  .student-row.blank-row .student-label { color: var(--blank-col); }
  .student-ans { font-size: 0.82rem; color: var(--wrong-col); text-decoration: line-through; text-decoration-color: rgba(217,64,64,0.5); }
  .blank-ans { font-size: 0.78rem; color: var(--muted); font-style: italic; }
  .tip-box { background: var(--tip-bg); border-left: 3px solid var(--accent); border-radius: 0 12px 12px 0; padding: 9px 13px; font-size: 0.74rem; color: #3a5ab0; line-height: 1.6; margin-top: 10px; flex-shrink: 0; }
  .tip-title { font-family: 'Space Grotesk', sans-serif; font-size: 0.58rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); margin-bottom: 5px; }
  .example-box { background: var(--ex-bg); border: 1px solid var(--border); border-radius: 12px; padding: 9px 13px; font-size: 0.72rem; color: var(--text2); line-height: 1.65; font-style: italic; margin-top: 7px; flex-shrink: 0; }
  .example-box em { color: var(--accent2); font-style: normal; font-weight: 600; }
  .tap-hint { text-align: center; font-size: 0.62rem; color: var(--muted); letter-spacing: 0.5px; padding-top: 8px; padding-bottom: 2px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .tap-hint::before, .tap-hint::after { content: ''; display: inline-block; width: 18px; height: 1px; background: var(--border); }
  .nav-hint { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 8px 20px 10px; }
  .nav-item { display: flex; align-items: center; gap: 5px; font-size: 0.63rem; color: var(--muted); letter-spacing: 0.5px; }
  .nav-arrow { font-size: 0.95rem; color: var(--border); }
  .nav-center { font-size: 0.63rem; color: var(--muted); }
  .swipe-indicator { position: absolute; font-family: 'Space Grotesk', sans-serif; font-size: 0.7rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 8px 16px; border-radius: 10px; opacity: 0; pointer-events: none; z-index: 20; transition: opacity 0.1s; }
  .ind-prev { top: 50%; transform: translateY(-50%); left: 16px; color: var(--accent); background: rgba(45,91,227,0.08); border: 1.5px solid rgba(45,91,227,0.2); }
  .ind-next { top: 50%; transform: translateY(-50%); right: 16px; color: var(--text2); background: rgba(0,0,0,0.05); border: 1.5px solid var(--border); }
  .ind-up { top: 16px; left: 50%; transform: translateX(-50%); color: var(--green); background: rgba(26,158,111,0.08); border: 1.5px solid rgba(26,158,111,0.2); }
  .ind-down { bottom: 16px; left: 50%; transform: translateX(-50%); color: var(--text2); background: rgba(0,0,0,0.05); border: 1.5px solid var(--border); }
  .random-btn { font-family: 'Space Grotesk', sans-serif; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.5px; padding: 8px 13px; border-radius: 18px; border: 1.5px solid var(--accent2); background: transparent; color: var(--accent2); cursor: pointer; transition: all 0.2s; min-height: 36px; touch-action: manipulation; display: inline-flex; align-items: center; gap: 4px; }
  .random-btn:active { transform: scale(0.93); }
  .random-btn.shuffled { background: var(--accent2); color: #fff; }
  .mode-chip { display: inline-flex; align-items: center; gap: 2px; background: var(--border); border-radius: 22px; padding: 3px; }
  .mode-btn { font-family: 'Space Grotesk', sans-serif; font-size: 0.6rem; font-weight: 600; padding: 8px 12px; border-radius: 18px; border: none; background: transparent; color: var(--text2); cursor: pointer; transition: all 0.2s; min-height: 36px; min-width: 60px; touch-action: manipulation; }
  .mode-btn.active { background: var(--card); color: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .end-card { position: absolute; width: calc(100% - 24px); max-width: 430px; height: calc(100% - 10px); max-height: 620px; touch-action: pan-y; transition: transform 0.32s cubic-bezier(.4,0,.2,1), opacity 0.32s; }
  .end-card.no-transition { transition: none !important; }
  .end-face { width: 100%; height: 100%; background: var(--card); border-radius: 22px; border: 1.5px solid var(--border); box-shadow: 0 8px 40px rgba(45,91,227,0.08); display: flex; flex-direction: column; overflow: hidden; }
  .end-line { height: 4px; flex-shrink: 0; border-radius: 22px 22px 0 0; background: linear-gradient(90deg, var(--accent) 0%, #6a8eff 50%, var(--green) 100%); }
  .end-content { flex: 1; padding: 24px 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; touch-action: pan-y; }
  .end-emoji { font-size: 3.4rem; line-height: 1; animation: pop 0.6s cubic-bezier(.175,.885,.32,1.275); }
  @keyframes pop { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .end-label { font-family: 'Space Grotesk', sans-serif; font-size: 0.62rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
  .end-title { font-size: 1.55rem; font-weight: 400; color: var(--text); line-height: 1.35; margin-top: -6px; }
  .end-subtitle { font-size: 0.85rem; color: var(--text2); line-height: 1.6; }
  .restart-btn { background: var(--accent); color: #fff; border: none; border-radius: 16px; padding: 14px 32px; font-family: 'Space Grotesk', sans-serif; font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 16px rgba(45,91,227,0.25); transition: transform 0.15s; touch-action: pan-y; min-height: 48px; display: inline-flex; align-items: center; gap: 8px; }
  .restart-btn:active { transform: scale(0.96); }
  .end-hint { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }
  @media (max-height: 700px) { .meaning-text { font-size: 1.6rem; } .word-text { font-size: 2.1rem; } .meaning-center, .word-center { min-height: 100px; padding: 6px 0; } }
  @media (max-height: 600px) { .header { padding: 8px 16px 6px; } .meaning-text { font-size: 1.4rem; } .word-text { font-size: 1.85rem; } }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-left">
      <div class="name">강응찬 · 오답노트</div>
      <div class="title">오답 단어장</div>
    </div>
    <div class="header-right">
      <div class="index-display"><span id="cur">1</span> <span>/ <span id="tot">-</span></span></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="random-btn" id="btn-random" type="button">🔀 랜덤</button>
        <div class="mode-chip">
          <button class="mode-btn active" id="btn-word" type="button">단어→뜻</button>
          <button class="mode-btn" id="btn-meaning" type="button">뜻→단어</button>
        </div>
      </div>
    </div>
  </div>
  <div class="prog-wrap"><div class="prog-dots" id="prog-dots"></div></div>
  <div class="card-viewport" id="viewport">
    <div class="swipe-indicator ind-prev" id="ind-prev">← 이전</div>
    <div class="swipe-indicator ind-next" id="ind-next">다음 →</div>
    <div class="swipe-indicator ind-up" id="ind-up">↑ 뒤집기</div>
    <div class="swipe-indicator ind-down" id="ind-down">↓ 뒤집기</div>
  </div>
  <div class="nav-hint">
    <div class="nav-item"><span class="nav-arrow">→</span> 이전 단어</div>
    <div class="nav-center">탭·위아래스와이프 = 뒤집기</div>
    <div class="nav-item">다음 단어 <span class="nav-arrow">←</span></div>
  </div>
</div>

<script>
// ── 오답 카드 데이터 (두 시험지 합본) ──────────────────────
// src: 'A' = DAY14/15,  'B' = DAY04~13
const cards = [
  // ══ DAY 14 / 15 오답 ══
  { num:6,  word:'come to mind',  pos:'동사구',    type:'wrong',
    correct:'떠오르다',      student:'명심하다',  src:'A',
    tip:'"명심하다"는 keep in mind! come to mind = 갑자기 생각이 떠오르다.',
    example:'A great idea <em>came to mind</em> while walking.' },

  { num:10, word:'direction',     pos:'명사',      type:'wrong',
    correct:'방향',          student:'위치',      src:'A',
    tip:'위치는 location / position. direction = 방향, 지시. "길 안내"도 directions!',
    example:'Which <em>direction</em> should we go?' },

  { num:17, word:'crash',         pos:'동사/명사',  type:'wrong',
    correct:'충돌하다',      student:'부수다',    src:'A',
    tip:'부수다는 break/smash. crash = 충돌·추락. 자동차 사고에 자주 등장!',
    example:'The car <em>crashed</em> into the barrier.' },

  { num:30, word:'secure',        pos:'형용사/동사', type:'wrong',
    correct:'안전한, 확보하다', student:'근고하다', src:'A',
    tip:'secure = 안전한(safe) + 확보하다(obtain) + 단단히 잠그다. 다양한 뜻에 주의!',
    example:'Please <em>secure</em> all windows before the storm.' },

  { num:36, word:'crack',         pos:'동사/명사',  type:'wrong',
    correct:'균열, 깨지다',  student:'부수다',    src:'A',
    tip:'crack = 금이 가다 / 균열. crash(충돌)와 헷갈리지 마세요!',
    example:'There is a <em>crack</em> in the glass.' },

  // ══ DAY 04 ~ 13 오답 ══
  { num:1,  word:'distinguish',   pos:'동사',      type:'wrong',
    correct:'구별하다',      student:'반만떠있는', src:'B',
    tip:'dis(분리) + tinguish(표시) → 서로 다른 것을 표시해 구별하다.',
    example:'Can you <em>distinguish</em> between the two sounds?' },

  { num:4,  word:'roast',         pos:'동사/명사',  type:'wrong',
    correct:'굽다, 볶다',    student:'구워진',    src:'B',
    tip:'roast = 굽다(동사) / 구운 고기(명사). "구워진"은 roasted(형용사)!',
    example:'Let\'s <em>roast</em> the chicken in the oven.' },

  { num:5,  word:'thread',        pos:'명사/동사',  type:'wrong',
    correct:'실, 꿰다',      student:'연설하다',  src:'B',
    tip:'thread = 바늘에 꿰는 실. 연설하다는 speech/address/deliver a speech.',
    example:'She threaded a needle with <em>thread</em>.' },

  { num:6,  word:'hire',          pos:'동사',      type:'wrong',
    correct:'고용하다',      student:'일하다',    src:'B',
    tip:'hire = 고용하다(employ). 일하다는 work. "고용"과 "일"은 다르다!',
    example:'They decided to <em>hire</em> ten new employees.' },

  { num:7,  word:'chore',         pos:'명사',      type:'wrong',
    correct:'허드렛일',      student:'뛰다',      src:'B',
    tip:'chore = 집안일, 잡일. household chores = 가사일. 발음도 /tʃɔːr/!',
    example:'Doing <em>chores</em> every day keeps the house clean.' },

  { num:8,  word:'turn in',       pos:'동사구',    type:'wrong',
    correct:'제출하다',      student:'~로 돌다',  src:'B',
    tip:'turn in = 제출하다(submit). "~로 돌다"는 turn into. 구동사 주의!',
    example:'Please <em>turn in</em> your assignment by Friday.' },

  { num:17, word:'department',    pos:'명사',      type:'wrong',
    correct:'부서, 학과',    student:'떠남',      src:'B',
    tip:'depart(떠나다)에서 왔지만, department = 부서·학과. 파생어 의미 주의!',
    example:'She works in the marketing <em>department</em>.' },

  { num:21, word:'complicated',   pos:'형용사',    type:'wrong',
    correct:'복잡한',        student:'끌난',      src:'B',
    tip:'complicated = complex(복잡한). com(함께) + plicate(접다) → 여러 겹으로 접힌.',
    example:'The instructions were too <em>complicated</em> to follow.' },

  { num:25, word:'edible',        pos:'형용사',    type:'wrong',
    correct:'먹을 수 있는',  student:'꼬추하다',  src:'B',
    tip:'ed(먹다, eat의 어근) + ible(가능한) → 먹을 수 있는. inedible = 먹을 수 없는.',
    example:'Are these mushrooms <em>edible</em>?' },

  { num:32, word:'eager',         pos:'형용사',    type:'wrong',
    correct:'열망하는, 간절한', student:'덩덩히',  src:'B',
    tip:'eager = 무언가를 강하게 원하는. eager to + 동사 = ~하고 싶어 안달난.',
    example:'She was <em>eager</em> to learn new skills.' },

  { num:33, word:'attract',       pos:'동사',      type:'wrong',
    correct:'끌다, 매혹하다', student:'매력적인',  src:'B',
    tip:'attract(동사) = 끌다. attractive(형용사) = 매력적인. 품사를 구분하세요!',
    example:'Flowers <em>attract</em> bees and butterflies.' },

  { num:34, word:'infection',     pos:'명사',      type:'wrong',
    correct:'감염, 전염',    student:'허의',      src:'B',
    tip:'infect(감염시키다) + ion → 감염. bacterial infection = 세균 감염.',
    example:'The <em>infection</em> spread quickly through the school.' },

  { num:38, word:'resident',      pos:'명사',      type:'wrong',
    correct:'거주자, 주민',  student:'거주하다',  src:'B',
    tip:'reside(거주하다) + nt(사람) = 거주자(명사). 거주하다는 reside/live in!',
    example:'All <em>residents</em> must register with the city.' },

  { num:40, word:'concentrate',   pos:'동사',      type:'wrong',
    correct:'집중하다',      student:'관심을 갖다', src:'B',
    tip:'concentrate on = ~에 집중하다. "관심을 갖다"는 be interested in / care about.',
    example:'Try to <em>concentrate</em> during the exam.' },

  { num:41, word:'dismiss',       pos:'동사',      type:'wrong',
    correct:'해고하다, 무시하다', student:'잡다',  src:'B',
    tip:'dismiss = 해고하다(fire) + 무시하다(ignore). dis(분리) + miss(보내다) → 내보내다.',
    example:'The manager dismissed his concerns without listening.' },

  { num:44, word:'superior',      pos:'형용사/명사', type:'wrong',
    correct:'우월한, 상관',  student:'능력자',    src:'B',
    tip:'super(위) + ior(비교급) → 위에 있는 것. superior to = ~보다 우월한.',
    example:'He always felt <em>superior</em> to his classmates.' },

  { num:47, word:'appliance',     pos:'명사',      type:'wrong',
    correct:'가전제품, 기기', student:'지원',      src:'B',
    tip:'apply(적용하다) + ance → 적용되는 도구 = 가전기기. "지원"은 support/aid.',
    example:'This store sells kitchen <em>appliances</em>.' },

  { num:49, word:'purpose',       pos:'명사',      type:'wrong',
    correct:'목적, 목표',    student:'추구하다',  src:'B',
    tip:'"추구하다"는 pursue(동사). purpose = 명사! on purpose = 의도적으로.',
    example:'What is the <em>purpose</em> of this meeting?' },

  // ══ 미기재 (blank) ══
  { num:19, word:'prescribe',     pos:'동사',      type:'blank',
    correct:'처방하다',      student:'',          src:'B',
    tip:'pre(미리) + scribe(쓰다) → 미리 써주다 = 처방하다. prescription = 처방전.',
    example:'The doctor <em>prescribed</em> antibiotics.' },

  { num:23, word:'spill',         pos:'동사/명사',  type:'blank',
    correct:'쏟다, 엎지르다', student:'',         src:'B',
    tip:'spill = 실수로 액체를 쏟다. "Don\'t cry over spilled milk" 속담도 기억!',
    example:'She accidentally <em>spilled</em> coffee on her laptop.' },

  { num:27, word:'detergent',     pos:'명사',      type:'blank',
    correct:'세제',          student:'',          src:'B',
    tip:'deter(제거하다) + gent → 오염을 제거하는 것 = 세제. laundry detergent = 세탁 세제.',
    example:'Add some <em>detergent</em> before starting the wash.' },

  { num:43, word:'distribute',    pos:'동사',      type:'blank',
    correct:'분배하다, 배포하다', student:'',     src:'B',
    tip:'dis(나누어) + tribute(주다) → 나누어 주다 = 분배·배포하다.',
    example:'The teacher will <em>distribute</em> the worksheets.' },

  { num:48, word:'ingredient',    pos:'명사',      type:'blank',
    correct:'재료, 성분',    student:'',          src:'B',
    tip:'in + gredi(들어가다) → 들어가는 것 = 재료·성분. 요리 레시피에 자주 등장!',
    example:'Mix all <em>ingredients</em> in a large bowl.' },
];

let idx = 0, startFace = 'word', showingBack = false, isAnimating = false;

function setStartFace(mode) {
  if (isAnimating) return;
  startFace = mode; showingBack = false;
  document.getElementById('btn-meaning').classList.toggle('active', mode === 'meaning');
  document.getElementById('btn-word').classList.toggle('active', mode === 'word');
  if (idx >= cards.length) return;
  renderCard(0);
}
document.getElementById('btn-meaning').addEventListener('click', () => setStartFace('meaning'));
document.getElementById('btn-word').addEventListener('click', () => setStartFace('word'));

const originalCards = [...cards];
let isShuffled = false;
function shuffleArray(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

document.getElementById('btn-random').addEventListener('click', function() {
  if (isAnimating) return; haptic(20);
  if (!isShuffled) { const s=shuffleArray(cards); cards.length=0; s.forEach(c=>cards.push(c)); isShuffled=true; this.classList.add('shuffled'); this.textContent='🔀 랜덤ON'; }
  else { cards.length=0; originalCards.forEach(c=>cards.push(c)); isShuffled=false; this.classList.remove('shuffled'); this.textContent='🔀 랜덤'; }
  idx=0; showingBack=false; buildDots(); renderCard(0);
});

function buildDots() {
  const wrap = document.getElementById('prog-dots'); wrap.innerHTML='';
  cards.forEach((_,i) => { const d=document.createElement('div'); d.className='pdot'; d.id=`dot-${i}`; wrap.appendChild(d); });
  updateDots();
}
function updateDots() {
  const isEnd = idx >= cards.length;
  cards.forEach((_,i) => { const d=document.getElementById(`dot-${i}`); if(!d)return; d.className='pdot'+(isEnd?' done all':i<idx?' done':i===idx?' current':''); });
  document.getElementById('cur').textContent = isEnd ? '✓' : (idx+1);
  document.getElementById('tot').textContent = cards.length;
}

function buildCardHTML(card) {
  const srcClass = card.src==='A' ? 'b-src1' : 'b-src2';
  const srcLabel = card.src==='A' ? 'DAY 14/15' : 'DAY 04~13';
  const badgeType = card.type==='blank' ? `<span class="badge b-blank">미기재</span>` : `<span class="badge b-wrong">오답</span>`;
  const lineClass = card.type==='blank' ? 'line-blank' : 'line-wrong';
  const studentHTML = card.type==='blank'
    ? `<div class="student-row blank-row"><span class="student-label">내 답</span><span class="blank-ans">미기재</span></div>`
    : `<div class="student-row"><span class="student-label">내 답</span><span class="student-ans">${card.student}</span></div>`;
  const badgesHTML = `<div class="badges"><span class="badge b-num">No.${card.num}</span>${badgeType}<span class="badge b-pos">${card.pos}</span><span class="badge ${srcClass}">${srcLabel}</span></div>`;

  const WF = `<div class="face-word">${badgesHTML}<div class="word-center"><div class="word-label">영단어</div><div class="word-text">${card.word}</div><div class="word-pos">${card.pos}</div></div><div class="tap-hint">탭해서 뜻 보기</div></div>`;
  const WB = `<div class="face-word">${badgesHTML}<div class="scroll-area"><div class="word-center" style="min-height:80px"><div class="word-label">영단어</div><div class="word-text" style="font-size:1.7rem">${card.word}</div></div><div class="meaning-label" style="text-align:center;margin-bottom:6px">뜻</div><div class="meaning-text" style="text-align:center;font-size:1.4rem;margin-bottom:10px">${card.correct}</div>${studentHTML}<div class="tip-box"><div class="tip-title">💡 암기 팁</div>${card.tip}</div><div class="example-box">${card.example}</div></div><div class="tap-hint">탭해서 영단어 보기</div></div>`;
  const MF = `<div class="face-meaning">${badgesHTML}<div class="meaning-center"><div class="meaning-label">뜻</div><div class="meaning-text">${card.correct}</div></div><div class="tap-hint">탭해서 영단어 보기</div></div>`;
  const MB = `<div class="face-meaning">${badgesHTML}<div class="scroll-area"><div class="word-center" style="min-height:100px"><div class="word-label">영단어</div><div class="word-text">${card.word}</div><div class="word-pos">${card.pos}</div></div>${studentHTML}<div class="tip-box"><div class="tip-title">💡 암기 팁</div>${card.tip}</div><div class="example-box">${card.example}</div></div><div class="tap-hint">탭해서 뜻 보기</div></div>`;

  const frontHTML = startFace==='meaning' ? MF : WF;
  const backHTML  = startFace==='meaning' ? MB : WB;
  return { frontHTML, backHTML, lineClass };
}

function buildEndHTML() {
  return `<div class="end-face"><div class="end-line"></div><div class="end-content"><div class="end-emoji">🎉</div><div><div class="end-label">All Done</div><div class="end-title">학습을 모두 마쳤어요!</div></div><div class="end-subtitle">오답 단어 ${cards.length}개를 모두 복습했어요.<br>한 번 더 반복하면 더욱 확실해져요 ✨</div><button class="restart-btn" id="restart-btn" type="button"><span>↻</span><span>다시 시작하기</span></button><div class="end-hint">← 스와이프하면 마지막 카드로 돌아가요</div></div></div>`;
}

let cardEl = null;
function renderCard(direction) {
  const vp = document.getElementById('viewport');
  const old = vp.querySelector('.flash-card, .end-card');
  const isEnd = idx >= cards.length;
  const el = document.createElement('div');
  if (isEnd) { el.className='end-card no-transition'; el.innerHTML=buildEndHTML(); }
  else {
    const { frontHTML, backHTML, lineClass } = buildCardHTML(cards[idx]);
    el.className='flash-card no-transition';
    el.innerHTML=`<div class="card-face"><div class="card-line ${lineClass}"></div><div class="card-content">${showingBack?backHTML:frontHTML}</div></div>`;
  }
  if (direction !== 0) { el.style.transform=`translateX(${direction>0?'100%':'-100%'})`; isAnimating=true; }
  vp.appendChild(el); cardEl=el;
  if (isEnd) { const btn=el.querySelector('#restart-btn'); if(btn) btn.addEventListener('click',restart); }
  requestAnimationFrame(() => requestAnimationFrame(() => { el.classList.remove('no-transition'); el.style.transform='translateX(0)'; }));
  if (old) { old.classList.remove('no-transition'); old.style.transform=`translateX(${direction>0?'-100%':'100%'})`; old.style.opacity='0.3'; setTimeout(()=>{if(old.parentNode)old.remove();isAnimating=false;},350); }
  else { isAnimating=false; }
  updateDots();
}

function restart() { if(isAnimating)return; idx=0; showingBack=false; haptic(15); renderCard(-1); }

function flipCard(el) {
  if (!el||isAnimating||idx>=cards.length||!el.querySelector('.card-face')) return;
  showingBack=!showingBack;
  const { frontHTML, backHTML } = buildCardHTML(cards[idx]);
  const content=el.querySelector('.card-content'), face=el.querySelector('.card-face');
  face.style.transition='transform 0.15s ease'; face.style.transform='scale(0.97)';
  setTimeout(()=>{ content.innerHTML=showingBack?backHTML:frontHTML; face.style.transform='scale(1)'; },80);
  setTimeout(()=>{ face.style.transition=''; },230);
}

function haptic(ms=8) { try{ if(window.navigator&&navigator.vibrate) navigator.vibrate(ms); }catch(_){} }

function initInteraction() {
  const vp = document.getElementById('viewport'); if(!vp)return;
  let sX=0,sY=0,sT=0,lX=0,lY=0,tracking=false,hasMoved=false,dir=null,pid=null;
  const DL=8,TT=8,SD=60,SVD=30,ST=350,VSD=45,VSVD=25;
  function getCard(){ return vp.querySelector('.flash-card, .end-card'); }
  function startT(x,y){ if(isAnimating)return false; tracking=true;hasMoved=false;dir=null;sX=x;lX=x;sY=y;lY=y;sT=Date.now(); const c=getCard();if(c)c.classList.add('dragging');return true; }
  function showInd(id,v){ document.getElementById(id).style.opacity=v; }
  function hideAll(){ ['ind-prev','ind-next','ind-up','ind-down'].forEach(id=>showInd(id,'0')); }
  function moveT(x,y,ev){
    if(!tracking)return; lX=x;lY=y;
    const dx=x-sX,dy=y-sY;
    if(dir===null){ if(Math.abs(dx)>DL||Math.abs(dy)>DL) dir=Math.abs(dx)>Math.abs(dy)*1.1?'h':Math.abs(dy)>Math.abs(dx)*1.1?'v':'h'; }
    if(dir==='h'){ if(ev&&ev.cancelable&&ev.type==='touchmove')ev.preventDefault(); hasMoved=true; const c=getCard();if(c){let f=0.55;if((dx>0&&idx===0)||(dx<0&&idx>=cards.length))f=0.25;c.style.transform=`translateX(${dx*f}px)`;} const t=Math.min(Math.abs(dx)/70,1); if(dx>5){showInd('ind-prev',String(t*0.9));showInd('ind-next','0');}else if(dx<-5){showInd('ind-next',String(t*0.9));showInd('ind-prev','0');}else{showInd('ind-prev','0');showInd('ind-next','0');} }
    else if(dir==='v'){ if(ev&&ev.cancelable&&ev.type==='touchmove')ev.preventDefault(); hasMoved=true; const c=getCard();if(c)c.style.transform=`translateY(${dy*0.25}px)`; const t=Math.min(Math.abs(dy)/50,1); if(dy<-5){showInd('ind-up',String(t*0.9));showInd('ind-down','0');}else if(dy>5){showInd('ind-down',String(t*0.9));showInd('ind-up','0');}else{showInd('ind-up','0');showInd('ind-down','0');} }
  }
  function endT(ex,ey){
    if(!tracking&&dir!=='h'&&dir!=='v'){dir=null;return;} tracking=false; hideAll();
    const c=getCard();if(c)c.classList.remove('dragging');
    const dx=ex-sX,dy=ey-sY,dt=Date.now()-sT;
    if(dir==='v'&&hasMoved){ const fv=dt<ST&&Math.abs(dy)>VSVD,fv2=Math.abs(dy)>VSD; if(c)c.style.transform=''; if(fv||fv2){if(idx<cards.length){haptic(8);flipCard(c);}}else{if(c){c.style.transition='transform 0.25s';c.style.transform='translateY(0)';setTimeout(()=>{if(c)c.style.transition=''},280);}} dir=null;return; }
    const wasH=dir==='h'&&hasMoved,isFast=wasH&&dt<ST&&Math.abs(dx)>SVD,isFar=wasH&&Math.abs(dx)>SD;
    if(wasH&&(isFast||isFar)){ if(c)c.style.transform=''; if(dx>0&&idx>0){idx--;showingBack=false;haptic(10);renderCard(-1);}else if(dx<0&&idx<cards.length){idx++;showingBack=false;haptic(10);renderCard(1);}else if(c){c.style.transition='transform 0.3s cubic-bezier(.175,.885,.32,1.275)';c.style.transform='translateX(0)';setTimeout(()=>{if(c)c.style.transition=''},350);} }
    else{ if(c&&wasH){c.style.transition='transform 0.25s';c.style.transform='translateX(0)';setTimeout(()=>{if(c)c.style.transition=''},280);}else if(c)c.style.transform=''; if(dir===null&&Math.abs(dx)<TT&&Math.abs(dy)<TT)flipCard(c); }
    dir=null;
  }
  function cancelT(){ tracking=false;hasMoved=false;dir=null; const c=getCard();if(c){c.classList.remove('dragging');c.style.transition='transform 0.25s';c.style.transform='translateX(0)';setTimeout(()=>{if(c)c.style.transition=''},280);} hideAll(); }

  if(window.PointerEvent){
    vp.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;if(pid!==null)return;if(!startT(e.clientX,e.clientY))return;pid=e.pointerId;});
    vp.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;moveT(e.clientX,e.clientY,e);});
    vp.addEventListener('pointerup',e=>{if(e.pointerId!==pid)return;pid=null;endT(e.clientX,e.clientY);});
    vp.addEventListener('pointercancel',e=>{if(e.pointerId!==pid)return;pid=null;cancelT();});
  } else {
    vp.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;startT(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
    vp.addEventListener('touchmove',e=>{if(!tracking||e.touches.length!==1)return;moveT(e.touches[0].clientX,e.touches[0].clientY,e);},{passive:false});
    vp.addEventListener('touchend',e=>{if(!e.changedTouches||!e.changedTouches.length)return;endT(e.changedTouches[0].clientX,e.changedTouches[0].clientY);},{passive:true});
    vp.addEventListener('touchcancel',cancelT,{passive:true});
    let md=false;
    vp.addEventListener('mousedown',e=>{if(!startT(e.clientX,e.clientY))return;md=true;});
    window.addEventListener('mousemove',e=>{if(!md)return;moveT(e.clientX,e.clientY,e);});
    window.addEventListener('mouseup',e=>{if(!md)return;md=false;endT(e.clientX,e.clientY);});
  }
}

document.addEventListener('keydown',e=>{
  if(isAnimating)return;
  if(e.key==='ArrowRight'&&idx>0){idx--;showingBack=false;renderCard(-1);}
  else if(e.key==='ArrowLeft'&&idx<cards.length){idx++;showingBack=false;renderCard(1);}
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();if(idx>=cards.length)restart();else if(cardEl)flipCard(cardEl);}
});
let lte=0; document.addEventListener('touchend',e=>{const n=Date.now();if(n-lte<=300)e.preventDefault();lte=n;},{passive:false});
function fixVH(){document.documentElement.style.setProperty('--app-vh',`${window.innerHeight*0.01}px`);}
window.addEventListener('resize',fixVH); window.addEventListener('orientationchange',fixVH); fixVH();
buildDots(); initInteraction(); renderCard(0);
</script>
</body>
