<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f0eb">
<meta name="referrer" content="no-referrer">
<title>오답 퀴즈 – 샘플</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f0eb;--card:#ffffff;--accent:#2d5be3;--accent2:#e3502d;
    --wrong-col:#d94040;--correct-col:#1a9e6f;--text:#1a1a2e;--text2:#6b6b80;
    --muted:#b0aab8;--border:#e2dcd8;--tip-bg:#eef3ff;--ex-bg:#faf8f5;
    --green:#1a9e6f;--pill-wrong:#fff0f0;--pill-correct:#ecfdf5;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;background:var(--bg);font-family:'Gowun Dodum',sans-serif;color:var(--text);overflow:hidden;-webkit-text-size-adjust:100%;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}

  /* ── Header ── */
  .header{flex-shrink:0;padding:12px 16px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;}
  .header-left .name{font-family:'Space Grotesk',sans-serif;font-size:0.65rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);}
  .header-left .title{font-family:'Space Grotesk',sans-serif;font-size:1.15rem;font-weight:700;color:var(--text);margin-top:2px;letter-spacing:-0.5px;}
  .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
  .index-display{font-family:'Space Grotesk',sans-serif;font-size:0.95rem;font-weight:700;color:var(--text);}
  .index-display span{color:var(--muted);font-weight:400;}
  .stage-pill{font-family:'Space Grotesk',sans-serif;font-size:0.55rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:10px;background:var(--tip-bg);color:var(--accent);border:1px solid #d0d8ff;}
  .stage-pill.subj{background:#fff5e8;color:#d97a20;border-color:#ffddb0;}
  .stage-pill.retry{background:#fce7f3;color:#be185d;border-color:#fbcfe8;}
  .stage-pill.done{background:var(--pill-correct);color:var(--correct-col);border-color:#a7f3d0;}

  /* ── Progress ── */
  .prog-wrap{flex-shrink:0;padding:0 16px 10px;}
  .prog-dots{display:flex;justify-content:space-between;gap:3px;}
  .pdot{flex:1;height:4px;border-radius:3px;background:var(--border);transition:all 0.3s;}
  .pdot.correct{background:var(--green);}
  .pdot.wrong{background:var(--wrong-col);}
  .pdot.current{background:var(--accent);opacity:0.5;}

  /* ── Viewport & swipe ── */
  .viewport{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0 12px;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none;}
  .quiz-card{position:absolute;width:calc(100% - 24px);max-width:430px;height:100%;max-height:640px;background:var(--card);border-radius:22px;border:1.5px solid var(--border);box-shadow:0 8px 40px rgba(45,91,227,0.08),0 2px 8px rgba(0,0,0,0.05);display:flex;flex-direction:column;overflow:hidden;transition:transform 0.35s cubic-bezier(.4,0,.2,1),opacity 0.35s;will-change:transform,opacity;touch-action:none;}
  .quiz-card.no-transition{transition:none!important;}
  .quiz-card.dragging{transition:none!important;}

  /* swipe indicators */
  .swipe-ind{position:absolute;font-family:'Space Grotesk',sans-serif;font-size:0.68rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:7px 14px;border-radius:10px;opacity:0;pointer-events:none;z-index:20;transition:opacity 0.1s;}
  .ind-next{top:50%;right:16px;transform:translateY(-50%);color:var(--text2);background:rgba(0,0,0,0.05);border:1.5px solid var(--border);}
  .ind-prev{top:50%;left:16px;transform:translateY(-50%);color:var(--accent);background:rgba(45,91,227,0.08);border:1.5px solid rgba(45,91,227,0.2);}

  .card-line{height:4px;flex-shrink:0;border-radius:22px 22px 0 0;background:linear-gradient(90deg,var(--accent) 0%,#6a8eff 100%);}
  .card-line.subj{background:linear-gradient(90deg,var(--accent2) 0%,#ff9980 100%);}
  .card-line.retry{background:linear-gradient(90deg,#be185d 0%,#f472b6 100%);}
  .card-line.result{background:linear-gradient(90deg,var(--green) 0%,#6ee7b7 100%);}

  .quiz-content{flex:1;display:flex;flex-direction:column;padding:14px 18px 10px;min-height:0;overflow:hidden;}
  .badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;flex-shrink:0;}
  .badge{font-family:'Space Grotesk',sans-serif;font-size:0.58rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:20px;}
  .b-num{background:var(--border);color:var(--text2);}
  .b-pos{background:#f0f0ff;color:var(--accent);border:1px solid #d0d8ff;}

  /* ── Prompt ── */
  .prompt-block{text-align:center;padding:6px 0 12px;flex-shrink:0;}
  .prompt-label{font-family:'Space Grotesk',sans-serif;font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
  .prompt-word{font-family:'Space Grotesk',sans-serif;font-size:1.9rem;font-weight:700;color:var(--text);letter-spacing:-1px;line-height:1.15;word-break:break-word;}
  .prompt-meaning{font-size:1.45rem;font-weight:400;color:var(--text);line-height:1.3;letter-spacing:-0.5px;}
  .prompt-tts{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:transparent;border:1.5px solid var(--border);color:var(--text2);cursor:pointer;margin-top:6px;font-size:0.9rem;transition:all 0.18s;}
  .prompt-tts:active{transform:scale(0.9);background:var(--tip-bg);border-color:var(--accent);color:var(--accent);}
  .prompt-tts.playing{border-color:var(--accent);color:var(--accent);background:var(--tip-bg);animation:pulse-tts 0.8s ease-in-out infinite alternate;}
  @keyframes pulse-tts{from{box-shadow:0 0 0 0 rgba(45,91,227,0.15)}to{box-shadow:0 0 0 6px rgba(45,91,227,0)}}

  /* ── MC Options ── */
  .options{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px;touch-action:none;-webkit-overflow-scrolling:touch;}
  .opt-btn{width:100%;text-align:left;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:10px 13px;font-family:'Gowun Dodum',sans-serif;font-size:0.93rem;color:var(--text);cursor:pointer;transition:all 0.18s;display:flex;align-items:center;gap:10px;line-height:1.4;}
  .opt-btn:active{transform:scale(0.98);}
  .opt-btn:hover:not(.disabled){border-color:var(--accent);background:#fafbff;}
  .opt-key{font-family:'Space Grotesk',sans-serif;font-size:0.68rem;font-weight:700;width:22px;height:22px;border-radius:50%;background:var(--border);color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.18s;}
  .opt-btn:hover:not(.disabled) .opt-key{background:var(--accent);color:#fff;}
  .opt-btn.correct{background:var(--pill-correct);border-color:var(--correct-col);color:var(--correct-col);}
  .opt-btn.correct .opt-key{background:var(--correct-col);color:#fff;}
  .opt-btn.wrong{background:var(--pill-wrong);border-color:var(--wrong-col);color:var(--wrong-col);}
  .opt-btn.wrong .opt-key{background:var(--wrong-col);color:#fff;}
  .opt-btn.disabled{pointer-events:none;}
  .opt-btn.show-answer{background:var(--pill-correct);border-color:var(--correct-col);color:var(--correct-col);}
  .opt-btn.show-answer .opt-key{background:var(--correct-col);color:#fff;}

  /* ── Feedback ── */
  .feedback{padding:9px 12px;border-radius:11px;margin-top:8px;flex-shrink:0;font-size:0.8rem;line-height:1.5;display:none;}
  .feedback.show{display:block;animation:fadeIn 0.25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  .feedback.correct{background:var(--pill-correct);border:1px solid #a7f3d0;color:#065f46;}
  .feedback.wrong{background:var(--pill-wrong);border:1px solid #fecaca;color:#991b1b;}
  .feedback-title{font-family:'Space Grotesk',sans-serif;font-size:0.58rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px;}
  .feedback-answer{font-weight:600;font-size:0.9rem;margin-bottom:2px;}
  .feedback-tip{font-size:0.72rem;opacity:0.85;line-height:1.5;}

  /* ── Swipe hint (replaces next button) ── */
  .swipe-hint{flex-shrink:0;padding:6px 0 8px;text-align:center;font-family:'Space Grotesk',sans-serif;font-size:0.6rem;color:var(--muted);letter-spacing:1px;display:none;}
  .swipe-hint.show{display:block;animation:fadeIn 0.3s ease;}
  .swipe-hint::before{content:'← ';} 

  /* ── Subjective: letter tiles ── */
  .subj-wrapper{flex:1;display:flex;flex-direction:column;min-height:0;gap:8px;}

  /* answer slots */
  .answer-slots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center;min-height:48px;padding:6px 4px;border:2px solid var(--border);border-radius:14px;background:#fafbff;transition:all 0.2s;flex-shrink:0;}
  .answer-slots.correct{border-color:var(--correct-col);background:var(--pill-correct);}
  .answer-slots.wrong{border-color:var(--wrong-col);background:var(--pill-wrong);}
  .slot{font-family:'Space Grotesk',sans-serif;font-size:1.45rem;font-weight:700;width:36px;height:44px;border-radius:9px;background:var(--card);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);transition:all 0.15s;cursor:pointer;}
  .slot.filled{background:var(--accent);border-color:var(--accent);color:#fff;animation:popIn 0.15s cubic-bezier(.175,.885,.32,1.275);}
  .slot.correct{background:var(--correct-col);border-color:var(--correct-col);color:#fff;}
  .slot.wrong{background:var(--wrong-col);border-color:var(--wrong-col);color:#fff;}
  .slot.shake{animation:shake 0.35s ease;}
  @keyframes popIn{0%{transform:scale(0.7)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  /* tile keyboard */
  .tile-keyboard{flex-shrink:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:6px 2px;}
  .tile{font-family:'Space Grotesk',sans-serif;font-size:1.35rem;font-weight:700;padding:0;width:58px;height:58px;border-radius:14px;border:none;background:var(--accent);color:#fff;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(45,91,227,0.4);touch-action:manipulation;}
  .tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(45,91,227,0.4);}
  .tile.used{opacity:0;pointer-events:none;}
  .tile-del{background:var(--accent2);box-shadow:0 4px 0 rgba(227,80,45,0.4);}
  .tile-del:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(227,80,45,0.4);}

  .subj-hint{font-size:0.72rem;color:var(--muted);text-align:center;flex-shrink:0;}
  .subj-hint strong{color:var(--text2);}

  /* ── Stage / Intro / Result cards ── */
  .stage-card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;gap:12px;}
  .stage-emoji{font-size:2.8rem;line-height:1;animation:pop 0.5s cubic-bezier(.175,.885,.32,1.275);}
  @keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  .stage-label{font-family:'Space Grotesk',sans-serif;font-size:0.6rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);}
  .stage-label.subj{color:var(--accent2);}
  .stage-label.retry{color:#be185d;}
  .stage-title{font-size:1.35rem;font-weight:400;color:var(--text);line-height:1.4;}
  .stage-sub{font-size:0.83rem;color:var(--text2);line-height:1.65;padding:0 8px;}
  .stage-stats{display:flex;gap:10px;margin-top:2px;}
  .stat-box{padding:9px 16px;border:1.5px solid var(--border);border-radius:12px;text-align:center;}
  .stat-num{font-family:'Space Grotesk',sans-serif;font-size:1.35rem;font-weight:700;color:var(--text);}
  .stat-num.c{color:var(--correct-col);}
  .stat-num.w{color:var(--wrong-col);}
  .stat-lbl{font-family:'Space Grotesk',sans-serif;font-size:0.53rem;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-top:3px;}
  .start-btn{background:var(--accent);color:#fff;border:none;border-radius:16px;padding:13px 30px;font-family:'Space Grotesk',sans-serif;font-size:0.8rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 16px rgba(45,91,227,0.25);min-height:46px;margin-top:4px;transition:transform 0.15s;}
  .start-btn:active{transform:scale(0.97);}
  .start-btn.subj{background:var(--accent2);box-shadow:0 4px 16px rgba(227,80,45,0.25);}
  .start-btn.retry{background:#be185d;box-shadow:0 4px 16px rgba(190,24,93,0.25);}

  /* ── Result ── */
  .result-content{flex:1;display:flex;flex-direction:column;padding:18px 20px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;}
  .score-circle{width:124px;height:124px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;position:relative;flex-shrink:0;}
  .score-circle::before{content:'';position:absolute;inset:9px;background:var(--card);border-radius:50%;}
  .score-inner{position:relative;text-align:center;}
  .score-num{font-family:'Space Grotesk',sans-serif;font-size:2rem;font-weight:700;color:var(--text);line-height:1;}
  .score-total{font-family:'Space Grotesk',sans-serif;font-size:0.66rem;color:var(--muted);letter-spacing:1px;margin-top:2px;}
  .result-title{text-align:center;font-size:1.2rem;font-weight:400;color:var(--text);margin-bottom:4px;}
  .result-sub{text-align:center;font-size:0.76rem;color:var(--text2);margin-bottom:12px;line-height:1.5;}
  .wrong-list-title{font-family:'Space Grotesk',sans-serif;font-size:0.58rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--wrong-col);margin-bottom:6px;}
  .perfect-msg{text-align:center;padding:13px;background:var(--pill-correct);border:1px solid #a7f3d0;border-radius:12px;color:#065f46;font-size:0.88rem;font-weight:600;}
  .wrong-item{background:var(--pill-wrong);border:1px solid #ffcccc;border-radius:10px;padding:8px 11px;margin-bottom:5px;}
  .wrong-item-row1{display:flex;align-items:baseline;gap:6px;}
  .wrong-item-word{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:0.9rem;color:var(--wrong-col);}
  .wrong-item-meaning{font-size:0.74rem;color:var(--text2);}
  .wrong-item-detail{font-size:0.68rem;color:#991b1b;margin-top:3px;font-style:italic;}

  @media(max-height:700px){
    .prompt-word{font-size:1.65rem}
    .prompt-meaning{font-size:1.25rem}
    .opt-btn{font-size:0.88rem;padding:9px 12px}
    .tile{width:52px;height:52px;font-size:1.2rem}
    .slot{width:32px;height:40px;font-size:1.3rem}
    .score-circle{width:108px;height:108px}
    .score-num{font-size:1.75rem}
  }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-left">
      <div class="name">바로그영어 · 샘플 학생</div>
      <div class="title">오답 퀴즈</div>
    </div>
    <div class="header-right">
      <span class="stage-pill" id="stage-pill">시작</span>
      <div class="index-display"><span id="cur">0</span><span> / <span id="tot">0</span></span></div>
    </div>
  </div>
  <div class="prog-wrap"><div class="prog-dots" id="prog-dots"></div></div>
  <div class="viewport" id="viewport">
    <div class="swipe-ind ind-prev" id="ind-prev">← 이전</div>
    <div class="swipe-ind ind-next" id="ind-next">다음 →</div>
  </div>
</div>

<script>
// ── 샘플 데이터 ──
const STUDENT_NAME = '샘플 학생';
const QUIZ_DATE    = '2026-05-16';
const ALL_WORDS = [
  { num:6,  word:'respect',   pos:'명사·동사',   correct:'존경, 존경하다',   student:'용의자',   tip:"'용의자'를 뜻하는 suspect와 발음이 비슷하니 주의해서 암기하세요." },
  { num:7,  word:'pesticide', pos:'명사',        correct:'살충제, 농약',     student:'(무응답)', tip:"해충을 의미하는 'pest'와 죽인다는 '-cide'가 합쳐진 단어예요." },
  { num:12, word:'access',    pos:'명사·동사',   correct:'접근, 접근하다',   student:'성공',     tip:"'성공'을 뜻하는 success와 철자가 비슷하니 주의하세요." },
  { num:16, word:'excess',    pos:'명사·형용사', correct:'초과, 초과한',     student:'접근하다', tip:"'접근'을 의미하는 access와 철자가 비슷하니 구분해서 외워두세요." },
  { num:21, word:'suspect',   pos:'명사·동사',   correct:'용의자, 의심하다', student:'존경하다', tip:"sus-(아래)+spect(보다) → 아래에서 본다 → 의심하다." },
  { num:25, word:'deceive',   pos:'동사',        correct:'속이다, 기만하다', student:'받다',     tip:"receive(받다)와 헷갈리지 마세요. de-는 '부정'의 의미." },
  { num:29, word:'peasant',   pos:'명사',        correct:'소작농, 농부',     student:'즐거운',   tip:"pleasant(즐거운)와 철자가 비슷하니 '농부'의 이미지로 암기하세요." },
  { num:34, word:'geography', pos:'명사',        correct:'지리, 지리학',     student:'지형',     tip:"geo-(땅)+-graphy(기록) → 땅을 기록하는 학문." }
];

// ── 상태 ──
let stage = 'intro';
let queue = [];
let pos = 0;
let answered = false; // 현재 문제 답했는지
let mcWrong   = [];
let subjWrong = [];
let cardEl    = null;
let isAnimating = false;

// ── 유틸 ──
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function haptic(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(_){}}
function normalize(s){return String(s||'').trim().toLowerCase();}

// ── 객관식 보기 생성 ──
function buildOptions(target){
  const opts = [target.correct];
  const studentWrongs = ALL_WORDS
    .filter(w=>w!==target)
    .map(w=>w.student)
    .filter(s=>s&&s!=='(무응답)'&&!/^[a-zA-Z]/.test(s)&&s!==target.correct);
  const otherCorrects = ALL_WORDS
    .filter(w=>w!==target)
    .map(w=>w.correct)
    .filter(c=>c!==target.correct);
  for(const c of shuffle([...new Set(studentWrongs)])){
    if(opts.length>=4)break;
    if(!opts.includes(c))opts.push(c);
  }
  for(const c of shuffle([...new Set(otherCorrects)])){
    if(opts.length>=4)break;
    if(!opts.includes(c))opts.push(c);
  }
  return shuffle(opts);
}

// ── 철자 타일 생성 ──
// 정답 글자 + 더미 글자 몇 개를 섞어서 제공
function buildTiles(word){
  const letters = word.toLowerCase().split('');
  // 더미 글자: 자주 쓰는 알파벳 중 정답에 없는 것 최대 4개
  const pool = 'abcdefghilmnoprstuy'.split('').filter(c=>!letters.includes(c));
  const dummies = shuffle(pool).slice(0, Math.min(4, Math.max(2, Math.floor(word.length*0.4))));
  return shuffle([...letters, ...dummies]);
}

// ── TTS ──
let currentAudio = null;
function speakWord(btn, word){
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  document.querySelectorAll('.prompt-tts.playing').forEach(b=>b.classList.remove('playing'));
  btn.classList.add('playing');
  const url=`https://translate.google.com/translate_tts?ie=UTF-8&tl=en&client=tw-ob&q=${encodeURIComponent(word)}`;
  const audio=new Audio(url);
  currentAudio=audio;
  audio.onended=audio.onerror=()=>{btn.classList.remove('playing');currentAudio=null;};
  audio.play().catch(()=>{btn.classList.remove('playing');currentAudio=null;});
}

// ── 점 ──
function buildDots(){
  const wrap=document.getElementById('prog-dots');
  wrap.innerHTML='';
  for(let i=0;i<queue.length;i++){
    const d=document.createElement('div');
    d.className='pdot';d.id=`dot-${i}`;
    wrap.appendChild(d);
  }
}
function updateDots(){
  for(let i=0;i<queue.length;i++){
    const d=document.getElementById(`dot-${i}`);
    if(!d)continue;
    const r=queue[i]._result;
    d.className='pdot'+(r==='correct'?' correct':r==='wrong'?' wrong':i===pos?' current':'');
  }
  document.getElementById('cur').textContent=Math.min(pos+1,queue.length);
  document.getElementById('tot').textContent=queue.length;
}

// ── 헤더 ──
function updateStagePill(){
  const p=document.getElementById('stage-pill');
  if(stage==='mc'){p.textContent='객관식';p.className='stage-pill';}
  else if(stage==='mc-retry'){p.textContent='객관식 재시도';p.className='stage-pill retry';}
  else if(stage==='subj'){p.textContent='주관식';p.className='stage-pill subj';}
  else if(stage==='subj-retry'){p.textContent='주관식 재시도';p.className='stage-pill retry';}
  else if(stage==='result'){p.textContent='완료';p.className='stage-pill done';}
  else{p.textContent='시작';p.className='stage-pill';}
}

// ── 카드 교체 (슬라이드 애니메이션) ──
function swapCard(html, direction){
  return new Promise(resolve => {
    const vp = document.getElementById('viewport');
    const old = cardEl;
    const el = document.createElement('div');
    el.className = 'quiz-card no-transition';
    el.innerHTML = html;
    // direction: 1=오른쪽에서 진입(다음), -1=왼쪽에서 진입(이전), 0=페이드
    if(direction!==0) el.style.transform = `translateX(${direction>0?'100%':'-100%'})`;
    else el.style.opacity='0';
    vp.appendChild(el);
    cardEl = el;

    isAnimating = true;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.classList.remove('no-transition');
      el.style.transform='translateX(0)';
      el.style.opacity='1';
      if(old){
        old.classList.remove('no-transition');
        old.style.transform=`translateX(${direction>0?'-100%':'100%'})`;
        old.style.opacity='0.3';
        setTimeout(()=>{old.remove();isAnimating=false;resolve();},360);
      } else {
        setTimeout(()=>{isAnimating=false;resolve();},360);
      }
    }));
  });
}

// ── 렌더 헬퍼 ──
async function renderStage(html, dir=0){
  await swapCard(html, dir);
}

// ── 인트로 ──
function renderIntro(){
  stage='intro'; updateStagePill();

  const html=`

    <div class="stage-card">

      <div class="stage-sub">총 <strong>${ALL_WORDS.length}개</strong>의 오답 단어<br>1단계: 객관식 (단어 → 뜻)<br>2단계: 주관식 (뜻 → 영단어 조합)<br>틀린 문제는 단계마다 다시 풀어요.</div>

// ── 객관식 ──
function startMC(){
  stage='mc';
  queue=ALL_WORDS.map(w=>({...w,_options:buildOptions(w),_result:null,_picked:null}));
  pos=0; mcWrong=[]; answered=false;
  buildDots(); updateStagePill();
  renderMC();
}

function mcHTML(){
  const q=queue[pos];
  const optsHTML=q._options.map((opt,i)=>{
    const key=String.fromCharCode(65+i);
    const cls=q._result
      ? (opt===q.correct ? (q._result==='correct'?'opt-btn correct disabled':'opt-btn show-answer disabled')
        : opt===q._picked ? 'opt-btn wrong disabled' : 'opt-btn disabled')
      : 'opt-btn';
    return `<button class="${cls}" type="button" ${q._result?'':'onclick="answerMC(this,\''+opt.replace(/'/g,"\\'")+'\')"'}><span class="opt-key">${key}</span><span>${opt}</span></button>`;
  }).join('');

  const fb = q._result
    ? (q._result==='correct'
        ? `<div class="feedback correct show"><div class="feedback-title">✓ 정답!</div><div class="feedback-answer">${q.word} — ${q.correct}</div>${q.tip?`<div class="feedback-tip">💡 ${q.tip}</div>`:''}</div>`
        : `<div class="feedback wrong show"><div class="feedback-title">✗ 오답</div><div class="feedback-answer">정답: ${q.correct}</div>${q.tip?`<div class="feedback-tip">💡 ${q.tip}</div>`:''}</div>`)
    : '';

  const hint = q._result
    ? `<div class="swipe-hint show">${pos<queue.length-1?'스와이프해서 다음 문제':'스와이프해서 결과 보기'}</div>`
    : '';

  return `
    <div class="card-line"></div>
    <div class="quiz-content">
      <div class="badges"><span class="badge b-num">No.${q.num}</span><span class="badge b-pos">${q.pos}</span></div>
      <div class="prompt-block">
        <div class="prompt-label">English</div>
        <div class="prompt-word">${q.word}</div>
        <button class="prompt-tts" type="button" onclick="speakWord(this,'${q.word.replace(/'/g,"\\'")}')">🔊</button>
      </div>
      <div class="options">${optsHTML}</div>
      ${fb}
    </div>
    ${hint}`;
}

async function renderMC(dir=1){
  answered=queue[pos]._result!==null;
  await renderStage(mcHTML(), dir);
  updateDots();
}

function answerMC(btn, chosen){
  const q=queue[pos];
  if(q._result)return;
  const isCorrect=chosen===q.correct;
  q._picked=chosen;
  q._result=isCorrect?'correct':'wrong';
  haptic(isCorrect?8:15);
  if(stage==='mc'&&!isCorrect) mcWrong.push(q);
  answered=true;

  // 버튼 즉시 업데이트
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.classList.add('disabled');
    b.onclick=null;
    const txt=b.querySelector('span:last-child').textContent;
    if(txt===q.correct){b.classList.add(isCorrect?'correct':'show-answer');}
    else if(b===btn&&!isCorrect){b.classList.add('wrong');}
  });

  const fb=isCorrect
    ?`<div class="feedback correct show"><div class="feedback-title">✓ 정답!</div><div class="feedback-answer">${q.word} — ${q.correct}</div>${q.tip?`<div class="feedback-tip">💡 ${q.tip}</div>`:''}</div>`
    :`<div class="feedback wrong show"><div class="feedback-title">✗ 오답</div><div class="feedback-answer">정답: ${q.correct}</div>${q.tip?`<div class="feedback-tip">💡 ${q.tip}</div>`:''}</div>`;

  cardEl.querySelector('.quiz-content').insertAdjacentHTML('beforeend',fb);
  const label=pos<queue.length-1?'스와이프해서 다음 문제':'스와이프해서 결과 보기';
  const hint=document.createElement('div');
  hint.className='swipe-hint show';
  hint.textContent=label;
  cardEl.appendChild(hint);
  updateDots();
}

function nextMC(){
  pos++;
  if(pos<queue.length){renderMC(1);return;}
  // 단계 종료
  if(stage==='mc'&&mcWrong.length>0){ renderMCRetryIntro(); }
  else if(stage==='mc-retry'){
    const still=queue.filter(q=>q._result==='wrong');
    if(still.length>0){
      queue=still.map(w=>({...w,_options:buildOptions(w),_result:null,_picked:null}));
      pos=0;buildDots();renderMC(1);
    } else { renderMCDone(); }
  } else { renderMCDone(); }
}

function prevMC(){
  if(pos>0){pos--;renderMC(-1);}
}

// ── 객관식 재시도 안내 ──

      </div>
      <div class="stage-sub">틀린 ${mcWrong.length}문제를 다시 풀어볼게요.<br>다 맞히면 주관식 단계로 넘어가요.</div>

// ── 주관식 시작 안내 ──
function renderMCDone(){

      <div class="stage-sub">이제 뜻을 보고<br><strong>글자 타일을 눌러 영단어</strong>를 완성하세요.</div>
      <button class="start-btn subj" onclick="startSubj()">주관식 시작 →</button>

// ── 주관식 ──
function startSubj(){
  stage='subj';
  queue=ALL_WORDS.map(w=>({...w,_tiles:buildTiles(w.word),_filled:[],_result:null,_picked:null}));
  pos=0;subjWrong=[];answered=false;
  buildDots();updateStagePill();
  renderSubj(1);
}

function subjHTML(){
  const q=queue[pos];
  const word=q.word.toLowerCase();
  const filled=q._filled||[];
  const done=q._result!==null;

  // 슬롯
  const slotsHTML=word.split('').map((_,i)=>{
    const ch=filled[i]||'';
    let cls='slot';
    if(ch)cls+=' filled';
    if(done) cls=done&&ch===word[i]?(cls.replace('filled','')+'slot correct'):'slot wrong';
    return `<div class="${cls}" ${(!done&&ch)?`onclick="removeLetter(${i})"`:''}>${ch}</div>`;
  }).join('');

  // 타일 키보드
  const tilesHTML=q._tiles.map((ch,ti)=>{
    const used=q._usedTiles&&q._usedTiles[ti];
    return `<button class="tile${used?' used':''}" type="button" ${done||used?'disabled':''} onclick="addLetter(${ti},'${ch}')">${ch.toUpperCase()}</button>`;
  }).join('')
  + `<button class="tile tile-del" type="button" ${done?'disabled':''} onclick="deleteLetter()">⌫</button>`;

  const fb=done
    ?(q._result==='correct'
        ?`<div class="feedback correct show"><div class="feedback-title">✓ 정답!</div><div class="feedback-answer">${q.word} — ${q.correct}</div>${q.tip?`<div class="feedback-tip">💡 ${q.tip}</div>`:''}</div>`
        :`<div class="feedback wrong show"><div class="feedback-title">✗ 오답</div><div class="feedback-answer">정답: ${q.word}</div>${q.tip?`<div class="feedback-tip">💡 ${q.tip}</div>`:''}</div>`)
    :'';

  const hint=done
    ?`<div class="swipe-hint show">${pos<queue.length-1?'스와이프해서 다음 문제':'스와이프해서 결과 보기'}</div>`:'';

  return `
    <div class="card-line subj"></div>
    <div class="quiz-content">
      <div class="badges"><span class="badge b-num">No.${q.num}</span><span class="badge b-pos">${q.pos}</span></div>
      <div class="prompt-block">
        <div class="prompt-label">Korean</div>
        <div class="prompt-meaning">${q.correct}</div>
      </div>
      <div class="subj-wrapper">
        <div class="answer-slots${done?(q._result==='correct'?' correct':' wrong'):''}" id="slots">${slotsHTML}</div>
        <div class="subj-hint">글자를 눌러 채우세요 · <strong>${q.word.charAt(0).toUpperCase()}</strong>로 시작</div>
        <div class="tile-keyboard" id="tile-kb">${tilesHTML}</div>
        ${fb}
      </div>
    </div>
    ${hint}`;
}

async function renderSubj(dir=1){
  answered=queue[pos]._result!==null;
  await renderStage(subjHTML(),dir);
  updateDots();
}

// 타일 눌러서 글자 추가
function addLetter(tileIdx, ch){
  const q=queue[pos];
  if(q._result!==null)return;
  if(!q._usedTiles)q._usedTiles={};
  if(q._usedTiles[tileIdx])return;
  const word=q.word.toLowerCase();
  if(q._filled.length>=word.length)return;
  q._filled.push(ch);
  q._usedTiles[tileIdx]=true;

  // 타일 숨기기
  const tileBtn=cardEl.querySelectorAll('.tile:not(.tile-del)')[tileIdx];
  if(tileBtn)tileBtn.classList.add('used');

  // 슬롯 업데이트
  const idx=q._filled.length-1;
  const slots=cardEl.querySelectorAll('.slot');
  if(slots[idx]){
    slots[idx].textContent=ch.toUpperCase();
    slots[idx].classList.add('filled');
    slots[idx].onclick=()=>removeLetter(idx);
  }

  // 다 채웠으면 자동 채점
  if(q._filled.length===word.length) checkSubj();
}

// 슬롯 클릭해서 마지막 글자 제거
function removeLetter(){
  const q=queue[pos];
  if(q._result!==null)return;
  if(q._filled.length===0)return;
  const idx=q._filled.length-1;
  // 해당 타일 찾아서 복원 (usedTiles에서 해당 인덱스 제거)
  if(q._usedTiles){
    const tiles=q._tiles;
    const ch=q._filled[q._filled.length-1];
    // 마지막으로 사용된 타일 인덱스 복원
    for(let ti=tiles.length-1;ti>=0;ti--){
      if(q._usedTiles[ti]&&tiles[ti]===ch){
        delete q._usedTiles[ti];
        const tileBtn=cardEl.querySelectorAll('.tile:not(.tile-del)')[ti];
        if(tileBtn)tileBtn.classList.remove('used');
        break;
      }
    }
  }
  q._filled.pop();
  const slots=cardEl.querySelectorAll('.slot');
  if(slots[idx]){
    slots[idx].textContent='';
    slots[idx].classList.remove('filled');
    slots[idx].onclick=null;
  }
}

function deleteLetter(){removeLetter();}

// 자동 채점
function checkSubj(){
  const q=queue[pos];
  const userWord=q._filled.join('').toLowerCase();
  const isCorrect=userWord===q.word.toLowerCase();
  q._picked=userWord;
  q._result=isCorrect?'correct':'wrong';
  haptic(isCorrect?8:18);
  if(stage==='subj'&&!isCorrect)subjWrong.push(q);
  answered=true;

  // 슬롯 색 업데이트
  const slotsEl=cardEl.querySelector('#slots');
  if(slotsEl)slotsEl.className='answer-slots'+(isCorrect?' correct':' wrong');
  const slots=cardEl.querySelectorAll('.slot');
  slots.forEach((s,i)=>{
    s.className='slot'+(isCorrect?' correct':q._filled[i]===q.word[i]?' correct':' wrong');
  });

  // 피드백
  const fb=isCorrect
    ?`<div class="feedback correct show"><div class="feedback-title">✓ 정답!</div><div class="feedback-answer">${q.word} — ${q.correct}</div>${q.tip?`<div class="feedback-tip">💡 ${q.tip}</div>`:''}</div>`
    :`<div class="feedback wrong show"><div class="feedback-title">✗ 오답</div><div class="feedback-answer">정답: ${q.word}</div>${q.tip?`<div class="feedback-tip">💡 ${q.tip}</div>`:''}</div>`;
  cardEl.querySelector('.subj-wrapper').insertAdjacentHTML('beforeend',fb);

  const label=pos<queue.length-1?'스와이프해서 다음 문제':'스와이프해서 결과 보기';
  const hint=document.createElement('div');
  hint.className='swipe-hint show';hint.textContent=label;
  cardEl.appendChild(hint);
  updateDots();
}

function nextSubj(){
  pos++;
  if(pos<queue.length){renderSubj(1);return;}
  if(stage==='subj'&&subjWrong.length>0){renderSubjRetryIntro();}
  else if(stage==='subj-retry'){
    const still=queue.filter(q=>q._result==='wrong');
    if(still.length>0){
      queue=still.map(w=>({...w,_tiles:buildTiles(w.word),_filled:[],_usedTiles:{},_result:null,_picked:null}));
      pos=0;buildDots();renderSubj(1);
    } else {renderResult();}
  } else {renderResult();}
}
function prevSubj(){if(pos>0){pos--;renderSubj(-1);}}

// ── 주관식 재시도 ──
function renderSubjRetryIntro(){
  stage='subj-retry';updateStagePill();
  const html=`
    <div class="card-line retry"></div>
    <div class="stage-card">
      <div class="stage-emoji">🔄</div>
      <div class="stage-label retry">Stage 2.5 / 재시도</div>
      <div class="stage-title">주관식 1차 완료!</div>
      <div class="stage-stats">
        <div class="stat-box"><div class="stat-num c">${ALL_WORDS.length-subjWrong.length}</div><div class="stat-lbl">맞음</div></div>
        <div class="stat-box"><div class="stat-num w">${subjWrong.length}</div><div class="stat-lbl">틀림</div></div>
      </div>
      <div class="stage-sub">틀린 ${subjWrong.length}문제를 다시 풀어볼게요.</div>
      <button class="start-btn retry" onclick="startSubjRetry()">다시 풀기 →</button>
    </div>`;
  renderStage(html,1);
}
function startSubjRetry(){
  queue=subjWrong.map(w=>({...w,_tiles:buildTiles(w.word),_filled:[],_usedTiles:{},_result:null,_picked:null}));
  pos=0;buildDots();renderSubj(1);
}

// ── 결과 ──
function renderResult(){
  stage='result';updateStagePill();
  document.getElementById('prog-dots').innerHTML='';
  document.getElementById('cur').textContent='✓';
  const total=ALL_WORDS.length;
  const mcScore=total-mcWrong.length;
  const subjScore=total-subjWrong.length;
  const totalCorrect=mcScore+subjScore;
  const totalQ=total*2;
  const pct=Math.round((totalCorrect/totalQ)*100);
  const deg=Math.round((pct/100)*360);
  const col=pct>=80?'var(--correct-col)':pct>=60?'var(--accent2)':'var(--wrong-col)';
  const finalWrong=[...new Map([...mcWrong,...subjWrong].map(w=>[w.word,w])).values()];

  let wrongHTML=finalWrong.length===0
    ?`<div class="perfect-msg">🏆 모든 단어를 정확히 맞혔어요!</div>`
    :`<div class="wrong-list">
       <div class="wrong-list-title">📌 다시 봐야 할 단어 (${finalWrong.length})</div>
       ${finalWrong.map(w=>{
         const inMC=mcWrong.find(x=>x.word===w.word);
         const inSubj=subjWrong.find(x=>x.word===w.word);
         const detail=[];
         if(inMC)detail.push(`객관식: '${inMC._picked}' 선택`);
         if(inSubj)detail.push(`주관식: '${inSubj._picked||'?'}' 입력`);
         return`<div class="wrong-item"><div class="wrong-item-row1"><span class="wrong-item-word">${w.word}</span><span class="wrong-item-meaning">${w.correct} · ${w.pos}</span></div><div class="wrong-item-detail">${detail.join(' / ')}</div></div>`;
       }).join('')}
     </div>`;

  const html=`
    <div class="card-line result"></div>
    <div class="result-content">
      <div class="score-circle" style="background:conic-gradient(${col} 0deg ${deg}deg,var(--border) ${deg}deg 360deg)">
        <div class="score-inner"><div class="score-num">${pct}<span style="font-size:1.1rem">%</span></div><div class="score-total">${totalCorrect}/${totalQ}</div></div>
      </div>
      <div class="result-title">수고했어요! 🎉</div>
      <div class="result-sub">객관식 ${mcScore}/${total} · 주관식 ${subjScore}/${total}</div>
      ${wrongHTML}
      <div style="margin-top:14px;padding-bottom:4px"><button class="start-btn" style="width:100%" onclick="location.reload()">↻ 다시 풀기</button></div>
    </div>`;
  renderStage(html,1);
}

// ── 스와이프 인터랙션 ──
function initSwipe(){
  const vp=document.getElementById('viewport');
  let sX=0,sY=0,sT=0,tracking=false,locked=null,pid=null;
  const DL=8,SD=40,SV=20,ST=450;

  function getCard(){return vp.querySelector('.quiz-card');}

  function canGoNext(){
    if(isAnimating)return false;
    const isQuestion=stage==='mc'||stage==='mc-retry'||stage==='subj'||stage==='subj-retry';
    if(!isQuestion)return false;
    // 답하지 않았으면 스와이프 막기 (앞으로만)
    return answered;
  }
  function canGoPrev(){
    if(isAnimating)return false;
    return (stage==='mc'||stage==='mc-retry')&&pos>0;
  }

  function start(x,y){
    tracking=true;locked=null;sX=x;sY=y;sT=Date.now();
    const c=getCard();if(c)c.classList.add('dragging');
  }
  function move(x,y,ev){
    if(!tracking)return;
    const dx=x-sX,dy=y-sY;
    if(locked===null&&(Math.abs(dx)>DL||Math.abs(dy)>DL)){
      locked=Math.abs(dx)>Math.abs(dy)?'h':'v';
    }
    if(locked==='h'){
      if(ev&&ev.cancelable)ev.preventDefault();
      const c=getCard();
      if(!c)return;
      const goingRight=dx>0; // 오른쪽으로 밀면 이전
      const goingLeft=dx<0;  // 왼쪽으로 밀면 다음
      const block=(goingLeft&&!canGoNext())||(goingRight&&!canGoPrev());
      c.style.transform=`translateX(${dx*(block?0.15:0.55)}px)`;
      const t=Math.min(Math.abs(dx)/70,1);
      document.getElementById('ind-prev').style.opacity=dx>8&&canGoPrev()?String(t*0.9):'0';
      document.getElementById('ind-next').style.opacity=dx<-8&&canGoNext()?String(t*0.9):'0';
    }
  }
  function end(ex,ey){
    if(!tracking){tracking=false;return;}
    tracking=false;
    document.getElementById('ind-prev').style.opacity='0';
    document.getElementById('ind-next').style.opacity='0';
    const c=getCard();
    if(c)c.classList.remove('dragging');
    const dx=ex-sX,dt=Date.now()-sT;
    const fast=dt<ST&&Math.abs(dx)>SV;
    const far=Math.abs(dx)>SD;
    if(locked==='h'&&(fast||far)){
      if(dx<0&&canGoNext()){
        // 왼쪽 스와이프 = 다음
        if(c){c.style.transform='';} 
        stage==='mc'||stage==='mc-retry'?nextMC():nextSubj();
      } else if(dx>0&&canGoPrev()){
        // 오른쪽 스와이프 = 이전
        if(c){c.style.transform='';}
        stage==='mc'||stage==='mc-retry'?prevMC():prevSubj();
      } else {
        if(c){c.style.transition='transform 0.3s cubic-bezier(.175,.885,.32,1.275)';c.style.transform='translateX(0)';setTimeout(()=>{if(c)c.style.transition='';},320);}
      }
    } else {
      if(c)c.style.transform='';
    }
    locked=null;
  }
  function cancel(){
    tracking=false;locked=null;
    document.getElementById('ind-prev').style.opacity='0';
    document.getElementById('ind-next').style.opacity='0';
    const c=getCard();
    if(c){c.classList.remove('dragging');c.style.transition='transform 0.25s';c.style.transform='translateX(0)';setTimeout(()=>{if(c)c.style.transition='';},280);}
  }

  if(window.PointerEvent){
    vp.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;if(pid!==null)return;pid=e.pointerId;start(e.clientX,e.clientY);},{capture:true});
    vp.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;move(e.clientX,e.clientY,e);},{capture:true});
    vp.addEventListener('pointerup',e=>{if(e.pointerId!==pid)return;pid=null;end(e.clientX,e.clientY);},{capture:true});
    vp.addEventListener('pointercancel',e=>{if(e.pointerId!==pid)return;pid=null;cancel();},{capture:true});
  } else {
    vp.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;start(e.touches[0].clientX,e.touches[0].clientY);},{passive:true,capture:true});
    vp.addEventListener('touchmove',e=>{if(!tracking||e.touches.length!==1)return;move(e.touches[0].clientX,e.touches[0].clientY,e);},{passive:false,capture:true});
    vp.addEventListener('touchend',e=>{if(!e.changedTouches.length)return;end(e.changedTouches[0].clientX,e.changedTouches[0].clientY);},{passive:true,capture:true});
    vp.addEventListener('touchcancel',cancel,{passive:true,capture:true});
  }
}

// ── 시작 ──
renderIntro();
initSwipe();
</script>
</body>
</html>
